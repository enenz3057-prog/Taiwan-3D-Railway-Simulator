<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣3D鐵路模擬器 - 臺鐵 EMU500 試運轉</title>
    <style>
        body {
            background-color: #557799;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            margin: 0;
            line-height: 40px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .join-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2;
            color: #fff;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #ddd;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>
    <div id="canvas-container"></div>
    <div class="info">場景：臺鐵高架車站區間 | 駕駛視角：臺鐵 EMU500</div>

    <script>
        // 1. 建立場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x667788); // 晴朗天空藍
        scene.fog = new THREE.FogExp2(0x667788, 0.012); // 加入一點點霧氣，增加景深

        // 2. 建立相機
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        // 調整相機位置，稍微偏左，模擬列車長視角
        camera.position.set(1.6, 2.3, 8.5); 
        camera.lookAt(1.6, 2.3, -10); 

        // 3. 建立渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // 啟用陰影
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // 柔和陰影
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 自然光影
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffee, 1.3);
        sunLight.position.set(10, 25, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 5. 立體碎石道床 (比原本更細緻)
        const stoneGeo = new THREE.DodecahedronGeometry(0.14, 0);
        const stoneMats = [
            new THREE.MeshStandardMaterial({ color: 0x6e6a65, roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0x524e49, roughness: 0.85 }),
            new THREE.MeshStandardMaterial({ color: 0x827d76, roughness: 0.75 }),
            new THREE.MeshStandardMaterial({ color: 0x3d3a36, roughness: 0.9 })
        ];

        const lengthRows = 300; // 軌道長度
        const widthCols = 28;   // 軌道寬度
        
        for (let r = 0; r < lengthRows; r++) {
            const zPos = (r - lengthRows / 2) * 0.4;
            for (let c = 0; c < widthCols; c++) {
                const xPos = (c - widthCols / 2) * 0.26;
                // 限制只在軌道下方生成
                if (Math.abs(xPos) < 4.2) {
                    const mat = stoneMats[Math.floor(Math.random() * stoneMats.length)];
                    const stone = new THREE.Mesh(stoneGeo, mat);
                    const yPos = -0.35 + (Math.random() * 0.08);
                    
                    stone.position.set(xPos + (Math.random()-0.5)*0.08, yPos, zPos + (Math.random()-0.5)*0.08);
                    stone.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                    
                    const scale = 0.6 + Math.random() * 0.7;
                    stone.scale.set(scale, scale * 0.6, scale);
                    
                    stone.castShadow = true;
                    stone.receiveShadow = true;
                    scene.add(stone);
                }
            }
        }

        // 6. 鐵鏽色金屬鋼軌
        const railMat = new THREE.MeshStandardMaterial({ 
            color: 0x8c5b3e, 
            metalness: 0.85, 
            roughness: 0.3, 
            emissive: 0x221105 
        });

        function createRail() {
            const railGroup = new THREE.Group();
            // 軌頭
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 120), railMat);
            head.position.y = 0.31;
            head.castShadow = true;
            railGroup.add(head);
            // 軌腰
            const web = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 120), railMat);
            web.position.y = 0.16;
            web.castShadow = true;
            railGroup.add(web);
            // 軌底
            const base = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 120), railMat);
            base.position.y = 0.04;
            base.castShadow = true;
            railGroup.add(base);

            return railGroup;
        }

        const trackOffset = 1.6; // 軌道中心距
        const l1 = createRail(); l1.position.x = -trackOffset - 1.067/2; scene.add(l1);
        const l2 = createRail(); l2.position.x = -trackOffset + 1.067/2; scene.add(l2);
        const r1 = createRail(); r1.position.x = trackOffset - 1.067/2; scene.add(r1);
        const r2 = createRail(); r2.position.x = trackOffset + 1.067/2; scene.add(r2);

        // 7. 灰色水泥枕木
        const sleeperGeo = new THREE.BoxGeometry(2.4, 0.18, 0.45);
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.75 });
        
        const sleeperCount = 130;
        const sleeperSpacing = 0.8;
        
        for (let i = 0; i < sleeperCount; i++) {
            const zPos = (i - sleeperCount / 2) * sleeperSpacing;
            
            const s1 = new THREE.Mesh(sleeperGeo, sleeperMat);
            s1.position.set(-trackOffset, -0.02, zPos);
            s1.castShadow = true; s1.receiveShadow = true;
            scene.add(s1);

            const s2 = new THREE.Mesh(sleeperGeo, sleeperMat);
            s2.position.set(trackOffset, -0.02, zPos);
            s2.castShadow = true; s2.receiveShadow = true;
            scene.add(s2);
        }

        // 8. 升級版：臺鐵高架車站懸臂式電車線支架模組
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.7 }); // 白色鋼柱
        const armMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.6, roughness: 0.3 }); // 金屬支架
        const insMat = new THREE.MeshStandardMaterial({ color: 0x5c2c16, roughness: 0.4 }); // 咖啡色絕緣子
        const wireMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

        // 輔助函數：在兩點間建立圓柱體（用於構建複雜支架）
        function createCylinderBetween(p1, p2, radius, material) {
            const distance = p1.distanceTo(p2);
            const geometry = new THREE.CylinderGeometry(radius, radius, distance, 8);
            const mesh = new THREE.Mesh(geometry, material);
            const midpoint = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
            mesh.position.copy(midpoint);
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(p2, p1).normalize());
            return mesh;
        }

        function createCatenaryPole(zPos, isLeftSide) {
            const group = new THREE.Group();
            const side = isLeftSide ? 1 : -1; 
            const poleX = 4.2 * side; // 電線桿位置
            const wireTargetX = 1.6 * side; // 電車線位置

            // 主立柱 (白色圓柱，比照照片中的鋼管柱)
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.25, 8.5, 16), poleMat);
            pole.position.set(poleX, 4.25, 0);
            pole.castShadow = true;
            group.add(pole);

            // 頂部橫臂 (鎖在柱子頂端)
            const pPoleTop = new THREE.Vector3(poleX - (0.2 * side), 7.2, 0);   
            const pPoleMid = new THREE.Vector3(poleX - (0.2 * side), 5.0, 0);   
            const pHorizontalEnd = new THREE.Vector3(wireTargetX, 7.2, 0);       

            const topArm = createCylinderBetween(pPoleTop, pHorizontalEnd, 0.045, armMat);
            group.add(topArm);

            // 斜拉支架 (增加穩定性)
            const pTopSlantStart = new THREE.Vector3(poleX - (0.2 * side), 6.5, 0);
            const pTopSlantEnd = new THREE.Vector3(poleX - (1.8 * side), 7.2, 0);
            const topSlantArm = createCylinderBetween(pTopSlantStart, pTopSlantEnd, 0.03, armMat);
            group.add(topSlantArm);

            // 絕緣子與懸臂組合 (這是照片中最精細的部分)
            const pInsStart = new THREE.Vector3(poleX - (1.4 * side), 5.7, 0);
            const pInsEnd = new THREE.Vector3(poleX - (2.1 * side), 6.1, 0);
            const pSlantEnd = new THREE.Vector3(wireTargetX - (0.1 * side), 6.8, 0);

            const slantPart1 = createCylinderBetween(pPoleMid, pInsStart, 0.035, armMat);
            const insulator = createCylinderBetween(pInsStart, pInsEnd, 0.065, insMat); // 咖啡色絕緣子
            const slantPart2 = createCylinderBetween(pInsEnd, pSlantEnd, 0.035, armMat);

            group.add(slantPart1);
            group.add(insulator);
            group.add(slantPart2);

            // 接觸線懸吊臂
            const pContactDrop = new THREE.Vector3(wireTargetX, 5.5, 0);
            const dropArm = createCylinderBetween(pHorizontalEnd, pContactDrop, 0.025, armMat);
            group.add(dropArm);

            group.position.set(0, 0, zPos);
            return group;
        }

        // 在軌道兩側生成電線桿
        const poleInterval = 15; // 電線桿間距
        let index = 0;
        for (let z = -100; z <= 100; z += poleInterval) {
            // 左右交錯設置電線桿（模擬真實情況）
            const isLeftSide = (index % 2 === 0);
            scene.add(createCatenaryPole(z, isLeftSide));
            index++;
        }

        // 架空電車線 (Catenary Wires)
        const wireGeo = new THREE.CylinderGeometry(0.015, 0.015, 220, 4);
        wireGeo.rotateX(Math
