<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台灣 3D 鐵路模擬器 - 專業版 (TRA Pro Sim)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        
        /* 專業級儀表板與介面設計 */
        #hud {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 15, 15, 0.85); border: 2px solid #444; border-radius: 12px;
            padding: 15px 30px; color: #fff; display: flex; gap: 40px; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .gauge-box { text-align: center; }
        .gauge-title { font-size: 12px; color: #aaa; margin-bottom: 3px; letter-spacing: 1px; }
        .gauge-value { font-size: 28px; font-weight: bold; color: #00ffcc; font-family: monospace; }
        
        #top-info {
            position: absolute; top: 20px; left: 20px; color: #fff;
            background: rgba(0,0,0,0.75); padding: 15px 20px; border-radius: 8px;
            border-left: 4px solid #ffcc00;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ffcc00; }
        p { margin: 3px 0; font-size: 13px; color: #ddd; }
        
        .btn-discord {
            display: inline-block; margin-top: 10px; padding: 6px 14px;
            background-color: #5865F2; color: white; text-decoration: none;
            border-radius: 5px; font-size: 13px; font-weight: bold; transition: background 0.2s;
        }
        .btn-discord:hover { background-color: #4752C4; }

        /* 號誌燈號介面 */
        #signaling {
            position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8);
            padding: 10px 15px; border-radius: 8px; color: white; font-family: monospace;
        }
        .signal-light { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background: #330000; margin-left: 5px; }
        .signal-light.green { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
    </style>
</head>
<body>
    <div id="top-info">
        <h1>台灣 3D 鐵路模擬器 [專業版]</h1>
        <p>控制方式：<b>W / S</b> 或畫面操作</p>
        <a href="https://discord.gg/dT47kurqw" target="_blank" class="btn-discord">加入官方 Discord 社群</a>
    </div>

    <div id="signaling">
        ATS 號誌: <span id="sigText">進行 (G)</span>
        <span class="signal-light green" id="sigLight"></span>
    </div>

    <!-- 擬真駕駛艙儀表板 -->
    <div id="hud">
        <div class="gauge-box">
            <div class="gauge-title">目前時速 (Speed)</div>
            <div class="gauge-value" id="speedDisplay">0.0 <span style="font-size:14px;">km/h</span></div>
        </div>
        <div class="gauge-box">
            <div class="gauge-title">軔機壓力 (BP)</div>
            <div class="gauge-value" style="color: #ff9900;" id="bpDisplay">5.0 <span style="font-size:14px;">kg/cm²</span></div>
        </div>
        <div class="gauge-box">
            <div class="gauge-title">動力段位 (Power)</div>
            <div class="gauge-value" style="color: #ffffff;" id="notchDisplay">N</div>
        </div>
    </div>

    <!-- 載入 Three.js -->
    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        // 1. 初始化核心
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee); // 晴空藍
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.012);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. 光照
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 0.8);
        dirLight.position.set(100, 150, 50);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 3. 環境與鐵道系統 (雙軌、枕木、V型電桿、山景)
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(3000, 3000),
            new THREE.MeshLambertMaterial({ color: 0x3b6e48 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.2;
        scene.add(ground);

        const trackGroup = new THREE.Group();
        const railMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.2 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32 });

        for (let z = -800; z < 800; z += 4) {
            // 枕木
            const sleeper = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.15, 0.8), sleeperMat);
            sleeper.position.set(0, 0, z);
            trackGroup.add(sleeper);

            // 雙軌 (1067mm 窄軌)
            const r1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 4), railMat);
            r1.position.set(-0.533, 0.1, z);
            const r2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.18, 4), railMat);
            r2.position.set(0.533, 0.1, z);
            trackGroup.add(r1, r2);

            // V型電車線支柱
            if (z % 40 === 0) {
                const poleMat = new THREE.MeshStandardMaterial({ color: 0x666666 });
                const pole = new THREE.Mesh(new THREE.BoxGeometry(0.3, 8, 0.3), poleMat);
                pole.position.set(3.5, 4, z);
                const arm = new THREE.Mesh(new THREE.BoxGeometry(7, 0.2, 0.2), poleMat);
                arm.position.set(0, 7.8, z);
                trackGroup.add(pole, arm);
            }
        }
        scene.add(trackGroup);

        // 4. 多節列車建立 (模擬完整編組)
        const trainGroup = new THREE.Group();
        const carBodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.2, metalness: 0.4 });
        const frontFaceMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.1 });
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0xdd2222 });

        // 建立 4 節連掛車廂
        for (let i = 0; i < 4; i++) {
            const carZ = i * 14;
            const car = new THREE.Group();

            const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.6, 13.8), carBodyMat);
            body.position.y = 1.4;
            car.add(body);

            const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.85, 0.35, 13.9), stripeMat);
            stripe.position.set(0, 0.9, 0);
            car.add(stripe);

            // 若是第一節車廂，加上流線頭燈造型
            if (i === 0) {
                const front = new THREE.Mesh(new THREE.BoxGeometry(2.82, 2.3, 1.2), frontFaceMat);
                front.position.set(0, 1.4, 6.5);
                car.add(front);
            }

            car.position.z = carZ;
            trainGroup.add(car);
        }
        scene.add(trainGroup);

        // 5. 物理與操控參數
        let speed = 0; // km/h
        let maxSpeed = 130;
        let notch = "N"; // N, P1, P2, B1, EB
        let brakePressure = 5.0; // kg/cm²
        let trainZ = 0;

        const keys = { w: false, s: false };
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'w') { notch = "P1"; keys.w = true; keys.s = false; }
            if (e.key.toLowerCase() === 's') { notch = "B1"; keys.s = true; keys.w = false; }
        });
        window.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() === 'w') { keys.w = false; notch = "N"; }
            if (e.key.toLowerCase() === 's') { keys.s = false; notch = "N"; }
        });

        // 6. 專業級渲染與物理迴圈
        function animate() {
            requestAnimationFrame(animate);

            // 動態物理計算
            if (keys.w) {
                speed += 12 * 0.016;
                brakePressure = Math.max(3.5, brakePressure - 0.5 * 0.016);
            } else if (keys.s) {
                speed -= 20 * 0.016;
                brakePressure = Math.min(5.0, brakePressure + 1.0 * 0.016);
            } else {
                if (speed > 0) speed -= 4 * 0.016; // 自然滑行阻力
                if (speed < 0) speed = 0;
            }

            speed = Math.max(0, Math.min(speed, maxSpeed));
            if (speed === 0 && !keys.s) notch = "N";

            // 移動列車
            const moveDist = (speed / 3.6) * 0.016;
            trainZ -= moveDist;
            trainGroup.position.z = trainZ;

            // 專業動態追尾視角 (模擬車外跟隨或側邊運镜)
            camera.position.set(4, 5, trainZ + 20);
            camera.lookAt(0, 2, trainZ - 10);

            // 更新專業介面數值
            document.getElementById('speedDisplay').innerHTML = `${speed.toFixed(1)} <span style="font-size:14px;">km/h</span>`;
            document.getElementById('bpDisplay').innerHTML = `${brakePressure.toFixed(1)} <span style="font-size:14px;">kg/cm²</span>`;
            document.getElementById('notchDisplay').innerText = notch;

            renderer.render(scene, camera);
        }

        animate();

        // 視窗自動調整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
