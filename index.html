<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taiwan 3D Railway Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.6);
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 85%;
        }
        .btn-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
        }
        .game-btn {
            background: #ff5722;
            color: white;
            border: none;
            padding: 15px 25px;
            font-size: 18px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
        }
        .game-btn:active {
            transform: scale(0.95);
            background: #e64a19;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>台鐵風格 3D 模擬器 (調度版)</h3>
        <p id="status-text">狀態：行駛中，準備進站</p>
        <p>玩法：使用下方按鈕控制加速與進站煞車。</p>
    </div>

    <div class="btn-container">
        <button class="game-btn" id="brake-btn">煞車 / 停車</button>
        <button class="game-btn" id="power-btn" style="background: #4CAF50;">動力 / 發車</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 燈光
        scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(5, 10, 7.5));
        scene.add(new THREE.AmbientLight(0x404040));

        // --- 建立鐵路與月台 ---
        // 長條主軌道
        const trackGeo = new THREE.BoxGeometry(60, 0.2, 2);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.position.set(0, -0.1, 0);
        scene.add(track);

        // 月台 (車站)
        const platformGeo = new THREE.BoxGeometry(15, 0.8, 2.5);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(10, 0.3, -2.5);
        scene.add(platform);

        // 火車
        const trainGeo = new THREE.BoxGeometry(4, 1.5, 1.8);
        const trainMat = new THREE.MeshStandardMaterial({ color: 0x1976D2 }); // 台鐵藍或自強號藍色調
        const train = new THREE.Mesh(trainGeo, trainMat);
        train.position.set(-25, 0.75, 0);
        scene.add(train);

        // --- 控制邏輯 ---
        let trainSpeed = 0.08;
        let isAtStation = false;
        let stationTimer = 0;

        const statusText = document.getElementById('status-text');

        document.getElementById('brake-btn').addEventListener('click', () => {
            trainSpeed = 0;
            statusText.innerText = "狀態：手動緊急煞車";
        });

        document.getElementById('power-btn').addEventListener('click', () => {
            if (!isAtStation) {
                trainSpeed = 0.08;
                statusText.innerText = "狀態：加速行駛中";
            }
        });

        function update() {
            // 移動火車
            train.position.x += trainSpeed;

            // 模擬進站自動停車機制
            if (train.position.x >= 9 && train.position.x <= 11 && trainSpeed > 0) {
                if (!isAtStation) {
                    trainSpeed = 0; // 自動停靠月台
                    isAtStation = true;
                    statusText.innerText = "狀態：已到站，上下客中 (3秒後發車)...";
                    
                    // 模擬載客 3 秒後自動發車
                    setTimeout(() => {
                        trainSpeed = 0.08;
                        isAtStation = false;
                        statusText.innerText = "狀態：離站加速中";
                    }, 3000);
                }
            }

            // 循環跑圖
            if (train.position.x > 30) {
                train.position.x = -25;
                statusText.innerText = "狀態：行駛中，前往下一站";
            }

            // 相機跟隨火車
            camera.position.x = train.position.x - 2;
            camera.position.y = 5;
            camera.position.z = 12;
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
