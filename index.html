<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taiwan Railway Sim - RB Style</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; user-select: none; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: sans-serif;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 85%;
            font-size: 13px;
        }
        /* 車種選單 */
        .top-menu {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 5px;
        }
        .menu-btn {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255,255,255,0.4);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }
        /* 鐵道控制台 (右下角) */
        .train-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }
        .ctrl-btn {
            background: #ff5722;
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        #btn-brake { background: #e91e63; }
        #btn-power { background: #4caf50; }
    </style>
</head>
<body>
    <div id="info">
        <h3>🇹🇼 台鐵軌道模擬器</h3>
        <p id="status-text">車種: 自強號 | 狀態: 行駛中</p>
        <p>玩法: 火車沿著軌道走，用右下角控制加速與煞車！</p>
    </div>

    <!-- 車種切換 -->
    <div class="top-menu">
        <button class="menu-btn" style="background:#d32f2f;" onclick="setTrain('tz', '自強號')">自強</button>
        <button class="menu-btn" style="background:#e65100;" onclick="setTrain('gk', '莒光號')">莒光</button>
        <button class="menu-btn" style="background:#0288d1;" onclick="setTrain('lc', '區間車')">區間</button>
    </div>

    <!-- 控制按鈕 -->
    <div class="train-controls">
        <button class="ctrl-btn" id="btn-brake">煞車</button>
        <button class="ctrl-btn" id="btn-power">動力</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(5, 10, 7.5));
        scene.add(new THREE.AmbientLight(0x404040));

        // 1. 建立環狀軌道路徑 (Path)
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-30, 0, 0),
            new THREE.Vector3(-15, 0, -20),
            new THREE.Vector3(15, 0, -20),
            new THREE.Vector3(30, 0, 0),
            new THREE.Vector3(15, 0, 20),
            new THREE.Vector3(-15, 0, 20),
        ], true); // true 代表封閉迴圈

        // 畫出軌道視覺
        const points = curve.getPoints(100);
        const trackGeo = new THREE.BufferGeometry().setFromPoints(points);
        const trackMat = new THREE.LineBasicMaterial({ color: 0x333333, linewidth: 3 });
        const trackLine = new THREE.Line(trackGeo, trackMat);
        scene.add(trackLine);

        // 2. 建立台鐵火車物件
        const trainGroup = new THREE.Group();
        const bodyGeo = new THREE.BoxGeometry(2, 1.4, 4);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
        const trainBody = new THREE.Mesh(bodyGeo, bodyMat);
        trainBody.position.y = 0.7;
        trainGroup.add(trainBody);

        const stripeGeo = new THREE.BoxGeometry(2.02, 0.3, 4.02);
        const stripeMat = new THREE.MeshStandardMaterial({ color: 0xd32f2f });
        const trainStripe = new THREE.Mesh(stripeGeo, stripeMat);
        trainStripe.position.y = 0.8;
        trainGroup.add(trainStripe);
        scene.add(trainGroup);

        // 遊戲變數
        let trainProgress = 0; // 軌道進度 (0 到 1)
        let trainSpeed = 0.001; // 當前速度
        let targetSpeed = 0.001; // 目標速度
        let currentName = '自強號';
        const statusText = document.getElementById('status-text');

        // 按鈕控制油門與煞車
        const powerBtn = document.getElementById('btn-power');
        const brakeBtn = document.getElementById('btn-brake');

        powerBtn.addEventListener('touchstart', () => { targetSpeed = 0.003; });
        powerBtn.addEventListener('touchend', () => { targetSpeed = 0.001; });
        powerBtn.addEventListener('mousedown', () => { targetSpeed = 0.003; });
        powerBtn.addEventListener('mouseup', () => { targetSpeed = 0.001; });

        brakeBtn.addEventListener('touchstart', () => { targetSpeed = 0; });
        brakeBtn.addEventListener('mousedown', () => { targetSpeed = 0; });

        function setTrain(type, name) {
            currentName = name;
            if (type === 'tz') { bodyMat.color.setHex(0xffffff); stripeMat.color.setHex(0xd32f2f); }
            if (type === 'gk') { bodyMat.color.setHex(0xe65100); stripeMat.color.setHex(0xffffff); }
            if (type === 'lc') { bodyMat.color.setHex(0x90a4ae); stripeMat.color.setHex(0x0288d1); }
        }

        // 主迴圈：火車嚴格乖乖照著軌道走
        function update() {
            // 漸進式加速/減速 (有物理慣性)
            trainSpeed += (targetSpeed - trainSpeed) * 0.05;
            trainProgress += trainSpeed;
            if (trainProgress > 1) trainProgress = 0;

            // 取得當前進度在軌道上的位置與方向
            const position = curve.getPointAt(trainProgress);
            const tangent = curve.getTangentAt(trainProgress);

            trainGroup.position.copy(position);
            trainGroup.position.y += 0.7; // 浮在軌道上

            // 讓車頭自動朝向軌道前方
            const lookAtPos = position.clone().add(tangent);
            trainGroup.lookAt(lookAtPos);
            trainGroup.rotateY(Math.PI); // 修正車頭方向

            statusText.innerText = `車種: ${currentName} | 速度: ${Math.round(trainSpeed * 3000)}`;

            // RB 風格第三人稱相機緊跟火車
            const cameraOffset = new THREE.Vector3(0, 3, -8).applyQuaternion(trainGroup.quaternion);
            camera.position.copy(position).add(cameraOffset);
            camera.position.y = position.y + 3;
            camera.lookAt(position);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
