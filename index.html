<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣3D鐵路模擬器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #111;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: rgba(20, 20, 20, 0.9);
            padding: 1rem;
            text-align: center;
            border-bottom: 2px solid #333;
            z-index: 10;
        }
        header h1 {
            font-size: 1.8rem;
            color: #4ade80;
            letter-spacing: 2px;
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .ui-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid #444;
            display: flex;
            gap: 20px;
            align-items: center;
            z-index: 10;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .control-group label {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 5px;
        }
        .speed-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
            font-family: monospace;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:active {
            transform: scale(0.95);
        }
        .instructions {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #ccc;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>台灣3D鐵路模擬器</h1>
    </header>

    <div class="instructions">
        💡 操作提示：使用下方控制面板加速、減速或煞車，體驗駕駛台鐵列車行駛於高架軌道的視角！
    </div>

    <div id="canvas-container">
        <!-- 3D 渲染畫布 -->
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="ui-panel">
        <div class="control-group">
            <label>目前速度</label>
            <div class="speed-display"><span id="speedVal">0</span> km/h</div>
        </div>
        <button onclick="accelerate()">加速 (+)</button>
        <button onclick="brake()">煞車 (-)</button>
        <button onclick="resetSpeed()" style="background: #475569;">歸零</button>
    </div>

    <!-- 載入 Three.js 3D 引擎庫 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 初始化 3D 場景
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 天空藍
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 3, 5);

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('simCanvas'), antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;

        // 環境光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(20, 40, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 建立高架軌道與週遭環境
        const trackLength = 400;
        
        // 地面/高架橋基座
        const bridgeGeo = new THREE.BoxGeometry(6, 1, trackLength);
        const bridgeMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
        const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
        bridge.position.set(0, -0.5, -trackLength / 2);
        scene.add(bridge);

        // 雙軌與枕木
        const railMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const trackGroup = new THREE.Group();

        for (let z = 0; z > -trackLength; z -= 2) {
            // 枕木
            const sleeperGeo = new THREE.BoxGeometry(3.2, 0.1, 0.6);
            const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
            sleeper.position.set(0, 0.05, z);
            trackGroup.add(sleeper);
        }

        // 鐵軌本體
        const leftRailGeo = new THREE.BoxGeometry(0.2, 0.3, trackLength);
        const leftRail = new THREE.Mesh(leftRailGeo, railMat);
        leftRail.position.set(-1.1, 0.2, -trackLength / 2);
        trackGroup.add(leftRail);

        const rightRailGeo = new THREE.BoxGeometry(0.2, 0.3, trackLength);
        const rightRail = new THREE.Mesh(rightRailGeo, railMat);
        rightRail.position.set(1.1, 0.2, -trackLength / 2);
        trackGroup.add(rightRail);

        scene.add(trackGroup);

        // 電車線桿 (仿造高架化車站月台風格)
        for (let z = 0; z > -trackLength; z -= 30) {
            const poleGeo = new THREE.CylinderGeometry(0.15, 0.15, 8);
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
            const pole = new THREE.Mesh(poleGeo, poleMat);
            pole.position.set(3.5, 4, z);
            scene.add(pole);

            // 橫臂
            const armGeo = new THREE.BoxGeometry(7, 0.15, 0.15);
            const arm = new THREE.Mesh(armGeo, poleMat);
            arm.position.set(0, 7.8, z);
            scene.add(arm);
        }

        // 模擬狀態變數
        let trainSpeed = 0;
        let zPosition = 0;

        function accelerate() {
            trainSpeed = Math.min(trainSpeed + 15, 130);
        }

        function brake() {
            trainSpeed = Math.max(trainSpeed - 20, 0);
        }

        function resetSpeed() {
            trainSpeed = 0;
        }

        // 動畫循環渲染
        function animate() {
            requestAnimationFrame(animate);

            // 根據速度推進位置
            if (trainSpeed > 0) {
                zPosition += (trainSpeed / 3600); // 簡單的速度換算
                if (zPosition > trackLength / 2) {
                    zPosition = 0; // 循環跑道
                }
                camera.position.z = 5 - (zPosition * 10);
            }

            // 些微的行進晃動感
            if (trainSpeed > 0) {
                camera.position.y = 3 + Math.sin(Date.now() * 0.01) * 0.03 * (trainSpeed / 100);
            }

            document.getElementById('speedVal').innerText = Math.round(trainSpeed);

            renderer.render(scene, camera);
        }

        animate();

        // 視窗縮放適應
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
