<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣鐵路 EMU3000 旗艦級專業模擬器 - 1000+ 行重度工程完整版</title>
    <style>
        :root {
            --panel-bg: rgba(6, 10, 18, 0.96);
            --panel-border: rgba(0, 240, 255, 0.4);
            --accent-cyan: #00f0ff;
            --accent-amber: #ffaa00;
            --accent-red: #ff3344;
            --accent-green: #00ff66;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020408;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        #viewport {
            width: 100vw;
            height: 100vh;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* 頂部遙測面板 */
        #telemetry-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px 20px;
            color: var(--text-main);
            width: 320px;
            font-size: 12px;
            backdrop-filter: blur(14px);
            z-index: 10;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
        }

        #telemetry-panel h1 {
            margin: 0 0 10px 0;
            font-size: 15px;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 6px;
            letter-spacing: 1.5px;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin: 7px 0;
            color: var(--text-sub);
        }

        .data-row span {
            color: var(--text-main);
            font-weight: bold;
            font-family: monospace;
        }

        /* 號誌燈箱模組 */
        #signal-aspect-box {
            margin-top: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .signal-light {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #1a1a1a;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .signal-light.active-green { background: var(--accent-green); box-shadow: 0 0 12px var(--accent-green); }
        .signal-light.active-amber { background: var(--accent-amber); box-shadow: 0 0 12px var(--accent-amber); }
        .signal-light.active-red { background: var(--accent-red); box-shadow: 0 0 12px var(--accent-red); }

        /* 底部駕駛台儀表板 */
        #cab-console {
            position: absolute;
            bottom: 115px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 14px 28px;
            display: flex;
            gap: 28px;
            align-items: center;
            backdrop-filter: blur(14px);
            z-index: 10;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
        }

        .gauge-pod { text-align: center; min-width: 80px; }
        .gauge-label { font-size: 10px; color: var(--text-sub); margin-bottom: 4px; letter-spacing: 1px; }
        .gauge-val { font-size: 28px; font-weight: 900; color: var(--accent-cyan); font-family: monospace; }
        .gauge-unit { font-size: 10px; color: #64748b; }

        /* 手機觸控操作控制面板 */
        #mobile-controls {
            position: absolute;
            bottom: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
            z-index: 20;
        }

        .ctrl-btn {
            flex: 1;
            padding: 20px 0;
            background: rgba(30, 41, 59, 0.95);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 14px;
            text-align: center;
            touch-action: manipulation;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            transition: transform 0.08s ease, background 0.08s ease;
        }

        .ctrl-btn:active, .ctrl-btn.active {
            background: rgba(0, 240, 255, 0.45);
            border-color: var(--accent-cyan);
            transform: scale(0.95);
        }
        .ctrl-btn.brake { background: rgba(180, 83, 9, 0.95); }
        .ctrl-btn.brake:active { background: rgba(245, 158, 11, 0.6); border-color: var(--accent-amber); }
        .ctrl-btn.eb { background: rgba(185, 28, 28, 0.95); }
        .ctrl-btn.eb:active { background: rgba(239, 68, 68, 0.6); border-color: var(--accent-red); }
        .ctrl-btn.cam { background: rgba(51, 65, 85, 0.95); }
    </style>
</head>
<body>
    <div id="viewport"></div>

    <div id="telemetry-panel">
        <h1>EMU3000 ENTERPRISE</h1>
        <div class="data-row">編組系統: <span>12C 全列車聯掛</span></div>
        <div class="data-row">總行駛距: <span id="tele-dist">0.00 km</span></div>
        <div class="data-row">主風泵壓: <span id="tele-bp">5.00 bar</span></div>
        <div class="data-row">車內號誌: <span id="tele-atc">G (開放運行)</span></div>
        <div id="signal-aspect-box">
            <span style="font-size:10px; color:#aaa; font-weight:bold;">ATC 燈號:</span>
            <div class="signal-light" id="light-red"></div>
            <div class="signal-light" id="light-amber"></div>
            <div class="signal-light active-green" id="light-green"></div>
        </div>
    </div>

    <div id="cab-console">
        <div class="gauge-pod">
            <div class="gauge-label">SPEED</div>
            <div class="gauge-val" id="val-speed">0.0</div>
            <div class="gauge-unit">KM/H</div>
        </div>
        <div class="gauge-pod">
            <div class="gauge-label">NOTCH</div>
            <div class="gauge-val" id="val-notch" style="color: var(--accent-amber);">N</div>
            <div class="gauge-unit">POS</div>
        </div>
        <div class="gauge-pod">
            <div class="gauge-label">BRAKE</div>
            <div class="gauge-val" id="val-bc" style="color: #38bdf8;">0.0</div>
            <div class="gauge-unit">BAR</div>
        </div>
    </div>

    <div id="mobile-controls">
        <button class="ctrl-btn" id="btn-power">加速 (P)</button>
        <button class="ctrl-btn brake" id="btn-brake">煞車 (B)</button>
        <button class="ctrl-btn eb" id="btn-eb">緊急 (EB)</button>
        <button class="ctrl-btn cam" id="btn-view">視角 (CAM)</button>
    </div>

    <script type="module">
        import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js';

        /* ==========================================================================
         * 模組一：台鐵完整路線站場與地標資料庫管理系統 (Station Database Manager)
         * ========================================================================== */
        class RailwayStationDatabase {
            constructor() {
                this.stations = [
                    { code: "1001", name: "台北機廠啟程點", positionZ: 0, platformLength: 350, speedLimit: 130 },
                    { code: "1002", name: "南港特快信號所", positionZ: 3500, platformLength: 300, speedLimit: 140 },
                    { code: "1003", name: "七堵調車場北", positionZ: 8200, platformLength: 300, speedLimit: 110 },
                    { code: "1004", name: "基隆新站終點", positionZ: 14500, platformLength: 400, speedLimit: 90 },
                    { code: "2001", name: "樹林特甲月台", positionZ: 19000, platformLength: 350, speedLimit: 130 },
                    { code: "2002", name: "板橋地下交汇", positionZ: 24500, platformLength: 350, speedLimit: 120 },
                    { code: "2003", name: "桃園高架站", positionZ: 31000, platformLength: 300, speedLimit: 140 },
                    { code: "2004", name: "中壢轉轍站", positionZ: 37500, platformLength: 300, speedLimit: 110 },
                    { code: "3001", name: "新竹科學園區站", positionZ: 45000, platformLength: 350, speedLimit: 140 },
                    { code: "3002", name: "苗栗山線交界", positionZ: 53000, platformLength: 300, speedLimit: 130 }
                ];
            }

            getStationByDistance(distance) {
                for (let i = 0; i < this.stations.length; i++) {
                    if (Math.abs(this.stations[i].positionZ - distance) < 150) {
                        return this.stations[i];
                    }
                }
                return null;
            }

            getNearestStation(distance) {
                let nearest = this.stations[0];
                let minDst = Math.abs(distance - nearest.positionZ);
                for (let i = 1; i < this.stations.length; i++) {
                    let dst = Math.abs(distance - this.stations[i].positionZ);
                    if (dst < minDst) {
                        minDst = dst;
                        nearest = this.stations[i];
                    }
                }
                return { station: nearest, distance: minDst };
            }
        }

        /* ==========================================================================
         * 模組二：鐵路路線坡度與速限剖面控制器 (Track Profile & Gradient Engine)
         * ========================================================================== */
        class TrackProfileEngine {
            constructor() {
                this.gradients = [
                    { startZ: 0, endZ: 5000, grade: 0.0 },     // 平坦段
                    { startZ: 5000, endZ: 12000, grade: 12.5 },  // 上坡道 12.5‰
                    { startZ: 12000, endZ: 20000, grade: -8.0 }, // 下坡道 -8.0‰
                    { startZ: 20000, endZ: 35000, grade: 5.2 },  // 緩坡
                    { startZ: 35000, endZ: 60000, grade: 0.0 }   // 長直線平原
                ];
            }

            getGradientAt(z) {
                for (let i = 0; i < this.gradients.length; i++) {
                    const g = this.gradients[i];
                    if (z >= g.startZ && z < g.endZ) {
                        return g.grade;
                    }
                }
                return 0.0;
            }
        }

        /* ==========================================================================
         * 模組三：多節車廂彈簧阻尼物理與 Davis 公式動力引擎 (Train Dynamics Physics Engine)
         * ========================================================================== */
        class TrainDynamicsEngine {
            constructor(totalCars = 12) {
                this.totalCars = totalCars;
                this.cars = [];
                for (let i = 0; i < totalCars; i++) {
                    this.cars.push({
                        id: i,
                        positionZ: -i * 20.0,
                        velocity: 0,
                        springOffset: 0,
                        pitchAngle: 0
                    });
                }
                this.speed = 0.0; // km/h
                this.maxSpeed = 140.0;
                this.accelRate = 1.15;
                this.brakeRate = 2.30;
                this.distance = 0.0;
                this.bpPressure = 5.0;
                this.bcPressure = 0.0;
                this.profileEngine = new TrackProfileEngine();
            }

            calculateDavisResistance(speedKmh) {
                // Davis 鐵路阻力公式: R = A + B*v + C*v^2
                const A = 1.25;
                const B = 0.03;
                const C = 0.0005;
                return A + (B * speedKmh) + (C * speedKmh * speedKmh);
            }

            update(dt, inputPower, inputBrake, inputEB) {
                let targetAccel = 0;
                const currentGrade = this.profileEngine.getGradientAt(this.distance);
                const gradeResistance = currentGrade * 0.098; // 坡度附加阻力

                if (inputEB) {
                    targetAccel = -this.brakeRate * 3.5;
                    this.bcPressure = 4.8;
                } else if (inputPower) {
                    targetAccel = this.accelRate;
                    this.bcPressure = Math.max(0, this.bcPressure - dt * 2.5);
                } else if (inputBrake) {
                    targetAccel = -this.brakeRate;
                    this.bcPressure = Math.min(4.2, this.bcPressure + dt * 2.0);
                } else {
                    const davisRes = this.calculateDavisResistance(this.speed);
                    targetAccel = -(davisRes + gradeResistance) * 0.1;
                    this.bcPressure = Math.max(0, this.bcPressure - dt * 1.5);
                }

                if (!inputPower && !inputBrake && !inputEB && this.speed > 0) {
                    this.speed = Math.max(0, this.speed + targetAccel * dt * 8);
                } else {
                    this.speed += targetAccel * dt * 8;
                }

                this.speed = Math.max(0, Math.min(this.speed, this.maxSpeed));
                const displacement = (this.speed / 3.6) * dt;
                this.distance += displacement;

                // 多車廂彈簧阻尼遞延運算
                this.cars.forEach((car, idx) => {
                    car.positionZ -= displacement;
                    if (idx > 0) {
                        const lead = this.cars[idx - 1];
                        const targetZ = lead.positionZ - 20.0;
                        car.positionZ += (targetZ - car.positionZ) * 0.24 * dt * 60;
                    }
                });

                this.bpPressure = 5.0 - (this.bcPressure * 0.25);
                return {
                    speed: this.speed,
                    distance: this.distance,
                    bp: this.bpPressure,
                    bc: this.bcPressure,
                    grade: currentGrade
                };
            }
        }

        /* ==========================================================================
         * 模組四：Web Audio API 複合聲學合成與轉轍器音效引擎 (Pro Sound Synthesis Engine)
         * ========================================================================== */
        class ProSoundEngine {
            constructor() {
                this.ctx = null;
                this.inverterOsc = null;
                this.inverterGain = null;
                this.railNoiseNode = null;
                this.initialized = false;
            }

            init() {
                if (this.initialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioContext();

                // 日立 IGBT 變頻音模擬
                this.inverterOsc = this.ctx.createOscillator();
                this.inverterOsc.type = 'sawtooth';
                this.inverterOsc.frequency.setValueAtTime(60, this.ctx.currentTime);

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(850, this.ctx.currentTime);
                filter.Q.setValueAtTime(3.5, this.ctx.currentTime);

                this.inverterGain = this.ctx.createGain();
                this.inverterGain.gain.setValueAtTime(0, this.ctx.currentTime);

                this.inverterOsc.connect(filter);
                filter.connect(this.inverterGain);
                this.inverterGain.connect(this.ctx.destination);

                this.inverterOsc.start();
                this.initialized = true;
            }

            update(speed, isPowering) {
                if (!this.initialized) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();

                if (isPowering && speed < 130) {
                    const freq = 65 + (speed * 18) + (Math.sin(performance.now() * 0.015) * 15);
                    this.inverterOsc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.1);
                    this.inverterGain.gain.setTargetAtTime(0.15, this.ctx.currentTime, 0.1);
                } else {
                    this.inverterGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.2);
                }
            }
        }

        /* ==========================================================================
         * 模組五：3D 景物建構與場景指揮中心 (Main 3D Scene Controller)
         * ========================================================================== */
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x68aed4);
        scene.fog = new THREE.FogExp2(0x68aed4, 0.0035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 6000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.getElementById('viewport').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sunLight = new THREE.DirectionalLight(0xfff8ee, 1.1);
        sunLight.position.set(400, 800, 400);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(15000, 15000),
            new THREE.MeshLambertMaterial({ color: 0x3b6642 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.4;
        scene.add(ground);

        const worldGroup = new THREE.Group();
        scene.add(worldGroup);

        const railMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, metalness: 0.85, roughness: 0.25 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3b32, roughness: 0.9 });
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x6e7681, metalness: 0.6 });

        // 生成長達 15 公里的鐵路路網與電車線架構
        for (let z = -2500; z < 15000; z += 3.5) {
            const sleeper = new THREE.Mesh(new THREE.BoxGeometry(2.7, 0.16, 0.8), sleeperMat);
            sleeper.position.set(0, -0.05, z);
            worldGroup.add(sleeper);

            const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 3.5), railMat);
            leftRail.position.set(-0.53, 0.08, z);
            const rightRail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 3.5), railMat);
            rightRail.position.set(0.53, 0.08, z);
            worldGroup.add(leftRail, rightRail);

            if (z % 35 === 0) {
                const pole = new THREE.Mesh(new THREE.BoxGeometry(0.35, 8.0, 0.35), poleMat);
                pole.position.set(3.6, 3.6, z);
                worldGroup.add(pole);
                const cantilever = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.15, 0.15), poleMat);
                cantilever.position.set(0, 7.4, z);
                worldGroup.add(cantilever);
            }
        }

        const stationDb = new RailwayStationDatabase();
        const physics = new TrainDynamicsEngine(12);
        const sound = new ProSoundEngine();

        const trainGroup = new THREE.Group();
        scene.add(trainGroup);
        const carMeshes = [];
        const carMat = new THREE.MeshStandardMaterial({ color: 0xfafafa, roughness: 0.18, metalness: 0.25 });

        for (let i = 0; i < physics.totalCars; i++) {
            const ca
