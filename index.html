<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <title>台灣3D鐵路模擬器</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            margin: 0;
            line-height: 40px;
            pointer-events: none;
        }
        .join-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2;
            color: #fff;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #aaa;
            z-index: 10;
            pointer-events: none;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>
    <div id="canvas-container"></div>
    <div class="info">軌距設定：1067mm 臺鐵特有窄軌規格</div>

    <script>
        // 1. 建立場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        // 2. 建立相機 (固定視角，直接看著鐵軌)
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 12); // 相機在正上方稍微退後
        camera.lookAt(0, 0, 0);       // 看向正中央

        // 3. 建立渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 建立燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(5, 10, 5);
        scene.add(dirLight);

        // 5. 建立鐵道元件
        // 道床
        const ballastGeo = new THREE.BoxGeometry(4.5, 0.4, 40);
        const ballastMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d });
        const ballast = new THREE.Mesh(ballastGeo, ballastMat);
        ballast.position.y = -0.2;
        scene.add(ballast);

        // 鋼軌 (左、右)
        const railGeo = new THREE.BoxGeometry(0.15, 0.3, 40);
        const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.9, roughness: 0.1 });
        
        const railLeft = new THREE.Mesh(railGeo, railMat);
        railLeft.position.set(-0.533, 0.15, 0); // 1067mm 寬度的一半約為 0.533
        scene.add(railLeft);

        const railRight = new THREE.Mesh(railGeo, railMat);
        railRight.position.set(0.533, 0.15, 0);
        scene.add(railRight);

        // 枕木
        const sleeperGeo = new THREE.BoxGeometry(2.2, 0.15, 0.4);
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const sleeperCount = 50;
        const sleeperSpacing = 0.8;
        
        for (let i = 0; i < sleeperCount; i++) {
            const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
            const zPos = (i - sleeperCount / 2) * sleeperSpacing;
            sleeper.position.set(0, -0.02, zPos);
            scene.add(sleeper);
        }

        // 6. 渲染畫面
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // 視窗縮放調整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
