<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣3D鐵路模擬器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #0b1329;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            padding: 0.8rem 1rem;
            text-align: center;
            border-bottom: 3px solid #ffcc00;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        header h1 {
            font-size: 1.6rem;
            color: #ffcc00;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }
        #canvas-container {
            flex: 1;
            width: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 仿真台鐵駕駛台控制面板 UI */
        .cab-dashboard {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #1a1a1a, #2d2d2d);
            border-top: 4px solid #444;
            padding: 15px 20px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
        }
        .dash-box {
            background: #111;
            border: 2px solid #555;
            border-radius: 8px;
            padding: 10px 20px;
            text-align: center;
            min-width: 130px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .dash-label {
            font-size: 0.75rem;
            color: #aaa;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }
        .dash-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ffcc;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 8px rgba(0,255,204,0.6);
        }
        .control-panel {
            display: flex;
            gap: 12px;
        }
        .handle-btn {
            background: linear-gradient(to bottom, #d9534f, #c9302c);
            color: white;
            border: 2px solid #ac2925;
            padding: 12px 22px;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .handle-btn.power {
            background: linear-gradient(to bottom, #5cb85c, #4cae4c);
            border-color: #398439;
        }
        .handle-btn.neutral {
            background: linear-gradient(to bottom, #f0ad4e, #eea236);
            border-color: #d58512;
        }
        .handle-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 2px rgba(0,0,0,0.3);
        }
        .hud-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 18px;
            border-radius: 8px;
            border-left: 4px solid #ffcc00;
            font-size: 0.9rem;
            color: #eee;
            z-index: 10;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>台灣3D鐵路模擬器</h1>
    </header>

    <div class="hud-info">
        🚄 駕駛視角：前方接近林邊高架車站<br>
        🕹️ 操作：點擊下方「牽引」加速，「制動」煞車減速
    </div>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <div class="cab-dashboard">
        <div class="dash-box">
            <div class="dash-label">目前速度</div>
            <div class="dash-value"><span id="speedVal">0</span> <span style="font-size:1rem;">km/h</span></div>
        </div>
        <div class="control-panel">
            <button class="handle-btn power" onclick="throttleUp()">牽引 (加速)</button>
            <button class="handle-btn neutral" onclick="coasting()">惰行</button>
            <button class="handle-btn" onclick="applyBrake()">制動 (煞車)</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee); // 明亮晴空藍
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.012);

        const camera = new THREE.PerspectiveCamera(65, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 2.2, 4); // 模擬駕駛座前方視角

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('simCanvas'), antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);

        // 光源
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 0.9);
        sunLight.position.set(30, 50, 20);
        scene.add(sunLight);

        // 建立高架鐵道環境 (仿高屏鐵路高架化風格：高架橋墩、雙軌、電車線懸臂)
        const trackLength = 800;
        const trackGroup = new THREE.Group();

        // 橋面基座 (高架板)
        const bridgeGeo = new THREE.BoxGeometry(8, 0.8, trackLength);
        const bridgeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.8 });
        const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
        bridge.position.set(0, -0.4, -trackLength / 2);
        trackGroup.add(bridge);

        // 橋墩
        for (let z = -20; z > -trackLength; z -= 40) {
            const pierGeo = new THREE.BoxGeometry(2, 15, 2);
            const pierMat = new THREE.MeshStandardMaterial({ color: 0xcccccc });
            const pier = new THREE.Mesh(pierGeo, pierMat);
            pier.position.set(0, -8, z);
            trackGroup.add(pier);
        }

        // 枕木與雙軌
        const railMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.8 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });

        for (let z = 0; z > -trackLength; z -= 2) {
            // 枕木
            const sleeper = new THREE.Mesh(new THREE.BoxGeometry(3.4, 0.15, 0.6), sleeperMat);
            sleeper.position.set(0, 0.08, z);
            trackGroup.add(sleeper);
        }

        // 左右鐵軌 (雙軌)
        // 左軌道組
        const leftRail1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, trackLength), railMat);
        leftRail1.position.set(-1.1, 0.25, -trackLength / 2);
        trackGroup.add(leftRail1);
        const leftRail2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, trackLength), railMat);
        leftRail2.position.set(-0.5, 0.25, -trackLength / 2);
        trackGroup.add(leftRail2);

        // 右軌道組
        const rightRail1 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, trackLength), railMat);
        rightRail1.position.set(0.5, 0.25, -trackLength / 2);
        trackGroup.add(rightRail1);
        const rightRail2 = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.25, trackLength), railMat);
        rightRail2.position.set(1.1, 0.25, -trackLength / 2);
        trackGroup.add(rightRail2);

        // 電車線門架與電桿 (高架鐵路特色)
        for (let z = 0; z > -trackLength; z -= 35) {
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee });
            // 側柱
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 9), poleMat);
            pole.position.set(4.5, 4.5, z);
            trackGroup.add(pole);

            // 橫樑
            const beam = new THREE.Mesh(new THREE.BoxGeometry(9, 0.2, 0.2), poleMat);
            beam.position.set(0, 8.8, z);
            trackGroup.add(beam);
        }

        scene.add(trackGroup);

        // 模擬物理變數
        let speed = 0;
        let distance = 0;

        function throttleUp() {
            speed = Math.min(speed + 10, 110); // 台鐵區間車/自強號常見速限
        }

        function coasting() {
            // 惰行微幅減速
            speed = Math.max(speed - 2, 0);
        }

        function applyBrake() {
            speed = Math.max(speed - 18, 0);
        }

        // 動畫主迴圈
        function animate() {
            requestAnimationFrame(animate);

            if (speed > 0) {
                // 距離推進
                distance += (speed / 3600) * 1.5;
                if (distance > trackLength / 2) {
                    distance = 0; // 循環跑道
                }
                camera.position.z = 4 - (distance * 12);
                
                // 模擬列車行進時的高架軌道規律上下晃動感
                camera.position.y = 2.2 + Math.sin(Date.now() * 0.015 * (speed / 40)) * 0.025;
            }

            document.getElementById('speedVal').innerText = Math.round(speed);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
