<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <title>台灣3D鐵路模擬器</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            margin: 0;
            line-height: 40px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .join-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2;
            color: #fff;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #aaa;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>
    <div id="canvas-container"></div>
    <div class="info">軌距設定：1067mm 臺鐵特有窄軌規格 (真實碎石與金屬鋼軌版)</div>

    <script>
        // 1. 建立場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0b0b);
        scene.fog = new THREE.FogExp2(0x0b0b0b, 0.025);

        // 2. 建立相機
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.2, 3.2, 7.5);
        camera.lookAt(0, 0, -2);

        // 3. 建立渲染器 (開啟高效能陰影)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 建立明亮的光影系統 (凸顯金屬反光)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        // 主太陽光
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
        sunLight.position.set(6, 15, 8);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 側向補光（專門打亮鋼軌，製造閃亮金屬感）
        const metalReflectLight = new THREE.DirectionalLight(0xddeeff, 1.0);
        metalReflectLight.position.set(-6, 5, -2);
        scene.add(metalReflectLight);

        // 5. 建立鐵道元件
        
        // (A) 底層道床基座
        const ballastBaseGeo = new THREE.BoxGeometry(4.6, 0.3, 80);
        const ballastBaseMat = new THREE.MeshStandardMaterial({ color: 0x2b2927, roughness: 0.95 });
        const ballastBase = new THREE.Mesh(ballastBaseGeo, ballastBaseMat);
        ballastBase.position.y = -0.25;
        ballastBase.receiveShadow = true;
        scene.add(ballastBase);

        // (A-2) 隨機碎石堆（用大量微小且形狀不規則的小方塊/小球堆疊，模擬一塊塊的石頭）
        const stoneGeo = new THREE.DodecahedronGeometry(0.12, 0); // 十二面體，看起來像碎石
        const stoneMaterials = [
            new THREE.MeshStandardMaterial({ color: 0x3a3835, roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0x504d48, roughness: 0.85 }),
            new THREE.MeshStandardMaterial({ color: 0x252422, roughness: 0.9 })
        ];

        // 隨機在道床上鋪滿碎石
        const stoneCount = 1200;
        for (let i = 0; i < stoneCount; i++) {
            const randomMat = stoneMaterials[Math.floor(Math.random() * stoneMaterials.length)];
            const stone = new THREE.Mesh(stoneGeo, randomMat);
            
            // 隨機散布在道床範圍內
            const x = (Math.random() - 0.5) * 4.2;
            const y = -0.1 + (Math.random() - 0.5) * 0.08;
            const z = (Math.random() - 0.5) * 78;
            
            stone.position.set(x, y, z);
            
            // 隨機旋轉與縮放，讓石頭看起來更自然不規則
            stone.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
            const scale = 0.6 + Math.random() * 0.8;
            stone.scale.set(scale, scale * 0.7, scale);
            
            stone.castShadow = true;
            stone.receiveShadow = true;
            scene.add(stone);
        }

        // (B) 真實亮銀色金屬鋼軌
        const railMat = new THREE.MeshStandardMaterial({ 
            color: 0xefefef,       // 非常明亮的銀白色
            metalness: 0.98,       // 極高金屬感
            roughness: 0.12        // 光滑、會反光
        });

        function createRail() {
            const railGroup = new THREE.Group();
            
            // 軌頭
            const headGeo = new THREE.BoxGeometry(0.12, 0.12, 80);
            const head = new THREE.Mesh(headGeo, railMat);
            head.position.y = 0.31;
            head.castShadow = true;
            railGroup.add(head);

            // 軌腰
            const webGeo = new THREE.BoxGeometry(0.05, 0.2, 80);
            const web = new THREE.Mesh(webGeo, railMat);
            web.position.y = 0.16;
            web.castShadow = true;
            railGroup.add(web);

            // 軌底
            const baseGeo = new THREE.BoxGeometry(0.22, 0.08, 80);
            const base = new THREE.Mesh(baseGeo, railMat);
            base.position.y = 0.04;
            base.castShadow = true;
            railGroup.add(base);

            return railGroup;
        }

        const gaugeHalf = 1.067 / 2; // 1067mm 窄軌
        
        const leftRail = createRail();
        leftRail.position.x = -gaugeHalf;
        scene.add(leftRail);

        const rightRail = createRail();
        rightRail.position.x = gaugeHalf;
        scene.add(rightRail);

        // (C) 枕木群
        const sleeperGeo = new THREE.BoxGeometry(2.4, 0.18, 0.45);
        const sleeperMat = new THREE.MeshStandardMaterial({ 
            color: 0x3d2817, 
            roughness: 0.85 
        });
        
        const sleeperCount = 80;
        const sleeperSpacing = 0.8;
        
        for (let i = 0; i < sleeperCount; i++) {
            const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
            const zPos = (i - sleeperCount / 2) * sleeperSpacing;
            sleeper.position.set(0, -0.01, zPos);
            sleeper.castShadow = true;
            sleeper.receiveShadow = true;
            scene.add(sleeper);
        }

        // 6. 動態渲染
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
