<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>台灣鐵路 3D 模擬器</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #000; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ffcc00; }
        p { margin: 3px 0; font-size: 14px; }
        .discord-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .discord-btn:hover {
            background-color: #4752C4;
        }
    </style>
</head>
<body>
    <div id="info">
        <h1>台灣鐵路 3D 模擬器 (TRA Sim)</h1>
        <p>操作方式：按 <b>W</b> 加速，按 <b>S</b> 煞車</p>
        <p id="speedText">目前時速: 0.0 km/h</p>
        <!-- 加入社群按鈕 -->
        <a href="https://discord.gg/dT47kurqw" target="_blank" class="discord-btn">加入社群 (Discord)</a>
    </div>

    <!-- 引入 Three.js 3D 引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. 初始化場景、相機與渲染器
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // 天空藍
        scene.fog = new THREE.Fog(0x87ceeb, 100, 500);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 加入環境光與太陽光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(100, 200, 100);
        scene.add(sunLight);

        // 3. 建立鐵路與地形環境
        const groundGeo = new THREE.PlaneGeometry(1000, 1000);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x3b7a57 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const trackGeo = new THREE.BoxGeometry(3, 0.1, 1000);
        const trackMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
        const tracks = new THREE.Mesh(trackGeo, trackMat);
        tracks.position.set(0, 0.05, 0);
        scene.add(tracks);

        // 4. 建立火車主體
        const trainGroup = new THREE.Group();
        
        const bodyGeo = new THREE.BoxGeometry(2.8, 2.5, 12);
        const bodyMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
        const trainBody = new THREE.Mesh(bodyGeo, bodyMat);
        trainBody.position.y = 1.3;
        trainGroup.add(trainBody);

        const frontGeo = new THREE.BoxGeometry(2.8, 2.3, 1);
        const frontMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const trainFront = new THREE.Mesh(frontGeo, frontMat);
        trainFront.position.set(0, 1.3, 6);
        trainGroup.add(trainFront);

        const stripeGeo = new THREE.BoxGeometry(2.85, 0.4, 12.1);
        const stripeMat = new THREE.MeshLambertMaterial({ color: 0xcc0000 });
        const trainStripe = new THREE.Mesh(stripeGeo, stripeMat);
        trainStripe.position.set(0, 0.8, 0);
        trainGroup.add(trainStripe);

        scene.add(trainGroup);

        // 5. 物理與控制變數
        let currentSpeed = 0; // km/h
        const maxSpeed = 130;
        const acceleration = 15;
        const deceleration = 25;
        const drag = 5;

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        // 6. 遊戲主循環
        let trainZ = 0;

        function animate() {
            requestAnimationFrame(animate);

            if (keys['w']) {
                currentSpeed += acceleration * 0.016;
            } else if (keys['s']) {
                currentSpeed -= deceleration * 0.016;
            } else {
                if (currentSpeed > 0) currentSpeed -= drag * 0.016;
                if (currentSpeed < 0) currentSpeed += drag * 0.016;
            }

            currentSpeed = Math.max(0, Math.min(currentSpeed, maxSpeed));

            const moveDist = (currentSpeed / 3.6) * 0.016;
            trainZ -= moveDist;
            trainGroup.position.z = trainZ;

            camera.position.set(0, 4, trainZ + 12);
            camera.lookAt(0, 2, trainZ - 10);

            document.getElementById('speedText').innerText = `目前時速: ${currentSpeed.toFixed(1)} km/h`;

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
