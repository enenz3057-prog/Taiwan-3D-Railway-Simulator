<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMU3000-Enterprise-Simulator OS</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.8rem; color: #38bdf8; }
        .subtitle { color: #94a3b8; font-size: 0.9rem; }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .gauge-card {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .gauge-value {
            font-size: 2.5rem;
            font-weight: bold;
            font-family: monospace;
        }
        .gauge-label {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .atc-status {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .aspect-light {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .aspect-light.active-g { background: var(--accent-green); box-shadow: 0 0 15px var(--accent-green); }
        .aspect-light.active-y { background: var(--accent-yellow); box-shadow: 0 0 15px var(--accent-yellow); color: #000; }
        .aspect-light.active-r { background: var(--accent-red); box-shadow: 0 0 15px var(--accent-red); }

        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        .btn-primary { background: #38bdf8; color: #0f172a; }
        .btn-warning { background: var(--accent-yellow); color: #0f172a; }
        .btn-danger { background: var(--accent-red); color: #fff; }
        .btn-success { background: var(--accent-green); color: #0f172a; }

        .log-box {
            background: #090d16;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.8rem;
            height: 150px;
            overflow-y: auto;
            color: #34d399;
        }
    </style>
</head>
<body>

    <header>
        <h1>EMU3000 企業級動態模擬系統</h1>
        <div class="subtitle">Enterprise Modular Railway Simulation OS v1.0</div>
    </header>

    <div class="container">
        <!-- 左側：駕駛艙儀表板與號誌 -->
        <div class="panel">
            <h3>駕駛艙儀表板 (Cab Dashboard)</h3>
            <div class="dashboard-grid">
                <div class="gauge-card">
                    <div id="speedDisplay" class="gauge-value">0.0</div>
                    <div class="gauge-label">列車速度 (km/h)</div>
                </div>
                <div class="gauge-card">
                    <div id="limitDisplay" class="gauge-value" style="color: #38bdf8;">130</div>
                    <div class="gauge-label">當前速限 (km/h)</div>
                </div>
            </div>

            <h3>ATC 列車自動防護系統</h3>
            <div class="atc-status">
                <div>車內號誌:</div>
                <div id="lightG" class="aspect-light active-g">G</div>
                <div id="lightY" class="aspect-light">Y</div>
                <div id="lightR" class="aspect-light">R</div>
                <div>倒數: <span id="countdownDisplay" style="font-family: monospace; font-weight: bold;">5.0</span>s</div>
            </div>

            <h3>系統事件日誌 (Event Log)</h3>
            <div id="logBox" class="log-box">
                [System] 系統初始化完成，等待駕駛員點擊啟動音效與運轉...<br>
            </div>
        </div>

        <!-- 右側：控制器與社群連線 -->
        <div class="panel controls-panel">
            <h3>運轉控制台</h3>
            <button class="btn-success" id="btnStartAudio">1. 啟動音效與物理引擎</button>
            <button class="btn-primary" id="btnPowerUp">加動力 (P Notch +)</button>
            <button class="btn-warning" id="btnBrake">施加制動 (Brake)</button>
            <button class="btn-danger" id="btnAck">確認警報 (ACK / ATS)</button>
            <hr style="border-color: #334155; width: 100%;">
            <h3>社群多機調度</h3>
            <button class="btn-primary" id="btnCommunity">連線線上調度伺服器</button>
            <div id="communityStatus" style="font-size: 0.85rem; color: #94a3b8;">狀態: 尚未連線</div>
        </div>
    </div>

    <script>
        // 核心模擬狀態
        let state = {
            speed: 0.0,
            speedLimit: 130.0,
            powerNotch: 0,
            brakeActive: false,
            ebTriggered: false,
            countdown: 5.0,
            audioStarted: false
        };

        let audioCtx = null;
        let oscillator = null;

        // UI 元素綁定
        const speedDisplay = document.getElementById('speedDisplay');
        const limitDisplay = document.getElementById('limitDisplay');
        const countdownDisplay = document.getElementById('countdownDisplay');
        const logBox = document.getElementById('logBox');
        const lightG = document.getElementById('lightG');
        const lightY = document.getElementById('lightY');
        const lightR = document.getElementById('lightR');

        function log(msg) {
            logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        // 啟動 Web Audio 變頻音
        document.getElementById('btnStartAudio').addEventListener('click', () => {
            if (!state.audioStarted) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                oscillator = audioCtx.createOscillator();
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(60, audioCtx.currentTime);
                
                const gainNode = audioCtx.createGain();
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                
                state.audioStarted = true;
                log("Hitachi VVVF 變頻音效引擎啟動成功！");
                document.getElementById('btnStartAudio').innerText = "音效運行中 (Active)";
                document.getElementById('btnStartAudio').disabled = true;
            }
        });

        // 控制按鈕事件
        document.getElementById('btnPowerUp').addEventListener('click', () => {
            if (state.ebTriggered) {
                log("錯誤：已發布 EB 緊急制動，無法加速！請先確認解除。");
                return;
            }
            state.powerNotch = Math.min(state.powerNotch + 1, 4);
            log(`控制器切至動力位: P${state.powerNotch}`);
        });

        document.getElementById('btnBrake').addEventListener('click', () => {
            state.powerNotch = 0;
            state.speed = Math.max(0, state.speed - 15);
            log("施加強制軔機，列車減速。");
        });

        document.getElementById('btnAck').addEventListener('click', () => {
            if (state.speed > state.speedLimit + 3) {
                state.countdown = 5.0;
                state.ebTriggered = false;
                log("已按下 ATS/ATC 確認鈕，解除警報倒數。");
            } else {
                log("當前未超速，無需確認。");
            }
        });

        document.getElementById('btnCommunity').addEventListener('click', () => {
            log("正在連線至台鐵線上模擬社群伺服器...");
            setTimeout(() => {
                document.getElementById('communityStatus').innerText = "狀態: 已連線 (同線線上駕駛: 12 人)";
                log("成功加入社群排班，已同步其他 12 位駕駛員位置。");
            }, 800);
        });

        // 主迴圈 (60Hz 物理與安全計算)
        let lastTime = performance.now();
        function mainLoop(timestamp) {
            const dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // 物理動力模擬
            if (state.powerNotch > 0 && !state.ebTriggered) {
                state.speed += state.powerNotch * 2.5 * dt;
            } else {
                state.speed = Math.max(0, state.speed - 1.2 * dt);
            }

            // 超速與 ATC 邏輯
            if (state.speed > state.speedLimit + 3.0) {
                state.countdown -= dt;
                lightG.className = "aspect-light";
                lightY.className = "aspect-light active-y";
                
                if (state.countdown <= 0) {
                    state.ebTriggered = true;
                    state.speed = Math.max(0, state.speed - 10.0 * dt);
                    lightY.className = "aspect-light";
                    lightR.className = "aspect-light active-r";
                    if (Math.random() < 0.05) log("【警告】超速未確認，ATC 已強制介入執行 EB（緊急制動）！");
                }
            } else {
                state.countdown = 5.0;
                if (!state.ebTriggered) {
                    lightG.className = "aspect-light active-g";
                    lightY.className = "aspect-light";
                    lightR.className = "aspect-light";
                }
            }

            // 更新 VVVF 頻率
            if (state.audioStarted && oscillator) {
                const targetFreq = 60 + (state.speed * 8);
                oscillator.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
            }

            // 畫面數值綁定
            speedDisplay.innerText = state.speed.toFixed(1);
            limitDisplay.innerText = state.speedLimit;
            countdownDisplay.innerText = Math.max(0, state.countdown).toFixed(1);

            requestAnimationFrame(mainLoop);
        }

        requestAnimationFrame(mainLoop);
    </script>
</body>
</html>
