<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣3D鐵路模擬器 - 臺鐵歸來車站 (手動駕駛版)</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }
        .top-btns {
            position: absolute;
            top: 10px;
            right: 10px;
            left: 10px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }
        .action-btn {
            background-color: #2ecc71;
            color: #fff;
            padding: 8px 6px;
            font-size: 11px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            flex: 1;
            text-align: center;
        }
        .action-btn:hover { background-color: #27ae60; }
        .drive-btn { background-color: #e67e22; }
        .board-btn { background-color: #3498db; }
        .outside-btn { background-color: #9b59b6; }
        .join-btn { background-color: #5865F2; }

        /* 手動駕駛 / 行走控制虛擬按鍵 */
        #controls-panel {
            position: absolute;
            bottom: 25px;
            left: 25px;
            z-index: 25;
            display: none;
            grid-template-columns: repeat(3, 50px);
            grid-template-rows: repeat(2, 50px);
            gap: 6px;
        }
        .ctrl-btn {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.7);
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }
        .ctrl-btn:active { background: rgba(46, 204, 113, 0.9); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* 車庫選單 */
        #train-menu {
            position: absolute;
            top: 55px;
            right: 10px;
            left: 10px;
            background: rgba(20, 20, 20, 0.96);
            border: 1px solid #777;
            border-radius: 6px;
            padding: 10px;
            display: none;
            z-index: 30;
            text-align: left;
            max-height: 65vh;
            overflow-y: auto;
        }
        #train-menu h3 { margin: 0 0 4px 0; font-size: 13px; color: #ffcc00; }
        #train-menu h4 { margin: 8px 0 3px 0; font-size: 11px; color: #2ecc71; border-bottom: 1px solid #555; padding-bottom: 2px; }
        #train-menu button {
            display: block; width: 100%; background: #333; color: #fff; border: none; padding: 7px; margin-bottom: 4px; border-radius: 4px; cursor: pointer; font-size: 11px; text-align: left;
        }
        #train-menu button:hover { background: #555; }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        .info {
            position: absolute; bottom: 10px; left: 10px; right: 10px; font-size: 11px; color: #fff; z-index: 10; pointer-events: none; background: rgba(0,0,0,0.6); padding: 6px; border-radius: 4px;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="top-btns">
        <button class="action-btn" onclick="toggleTrainMenu()">台鐵車庫</button>
        <button class="action-btn drive-btn" onclick="enterCabin()">駕駛室</button>
        <button class="action-btn board-btn" onclick="enterPassengerCar()">上車</button>
        <button class="action-btn outside-btn" onclick="exitToOutside()">站台外部</button>
        <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="action-btn join-btn">加入會員</a>
    </div>

    <!-- 手動控制虛擬按鍵 -->
    <div id="controls-panel">
        <button class="ctrl-btn btn-up" ontouchstart="setControl('UP', true)" ontouchend="setControl('UP', false)" onmousedown="setControl('UP', true)" onmouseup="setControl('UP', false)">▲</button>
        <button class="ctrl-btn btn-left" ontouchstart="setControl('LEFT', true)" ontouchend="setControl('LEFT', false)" onmousedown="setControl('LEFT', true)" onmouseup="setControl('LEFT', false)">◀</button>
        <button class="ctrl-btn btn-down" ontouchstart="setControl('DOWN', true)" ontouchend="setControl('DOWN', false)" onmousedown="setControl('DOWN', true)" onmouseup="setControl('DOWN', false)">▼</button>
        <button class="ctrl-btn btn-right" ontouchstart="setControl('RIGHT', true)" ontouchend="setControl('RIGHT', false)" onmousedown="setControl('RIGHT', true)" onmouseup="setControl('RIGHT', false)">▶</button>
    </div>

    <!-- 車庫選單 -->
    <div id="train-menu">
        <h3>臺鐵全車型選擇</h3>
        <h4>1. 自強號家族</h4>
        <button onclick="spawnTrain('EMU3000')">EMU3000 新自強號</button>
        <button onclick="spawnTrain('PP')">E1000 推拉式自強號</button>
        <button onclick="spawnTrain('TEMU1000')">TEMU1000 太魯閣號</button>
        <button onclick="spawnTrain('TEMU2000')">TEMU2000 普悠瑪號</button>
        <h4>2. 通勤電聯車</h4>
        <button onclick="spawnTrain('EMU900')">EMU900 新一代區間車</button>
        <button onclick="spawnTrain('EMU500')">EMU500 經典藍黃區間車</button>
    </div>

    <div id="canvas-container"></div>
    <div class="info" id="info-text">場景：臺鐵歸來車站 | 請點擊「台鐵車庫」選擇列車，並使用 ▲▼ 鍵手動加速</div>

    <script>
        let audioCtx = null, crossingInterval = null, isCrossingActive = false;

        function initAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
        }

        function playCrossingSound() {
            initAudio();
            if (isCrossingActive || !audioCtx) return;
            isCrossingActive = true;
            let high = true;
            crossingInterval = setInterval(() => {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.value = high ? 750 : 600;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.25);
                    high = !high;
                } catch(e) {}
            }, 500);
        }

        // 1. 場景設定
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x6fb3e2);
        scene.fog = new THREE.FogExp2(0x6fb3e2, 0.0008);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 3000);
        camera.position.set(8, 4, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const sun = new THREE.DirectionalLight(0xfffaed, 1.2);
        sun.position.set(40, 70, 30);
        sun.castShadow = true;
        scene.add(sun);

        // 2. 地面與草皮、歸來車站
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(5000, 5000), new THREE.MeshStandardMaterial({ color: 0x4f8a3b }));
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.45;
        scene.add(ground);

        const platform = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.55, 1200), new THREE.MeshStandardMaterial({ color: 0xdcdcdc }));
        platform.position.set(4.3, -0.2, 0);
        scene.add(platform);

        const stationGroup = new THREE.Group();
        const mainStation = new THREE.Mesh(new THREE.BoxGeometry(16, 6.5, 10), new THREE.MeshStandardMaterial({ color: 0xf5f5f5 }));
        mainStation.position.set(12, 3, -15);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(11, 3.5, 4), new THREE.MeshStandardMaterial({ color: 0x992222 }));
        roof.position.set(12, 7.8, -15);
        roof.rotation.y = Math.PI / 4;
        stationGroup.add(mainStation, roof);
        scene.add(stationGroup);

        // 3. 超長鐵軌 (長度擴展至 3000 公尺)
        const trackGroup = new THREE.Group();
        const tieMat = new THREE.MeshStandardMaterial({ color: 0x4a3525 });
        const railMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.9 });

        for (let z = -1500; z <= 1500; z += 1.0) {
            const tie = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.4), tieMat);
            tie.position.set(0, -0.35, z);
            trackGroup.add(tie);
        }
        [-0.75, 0.75].forEach(x => {
            const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 3002), railMat);
            rail.position.set(x, -0.07, 0);
            trackGroup.add(rail);
        });
        trackGroup.position.x = -1.5;
        scene.add(trackGroup);

        // 電線杆
        for (let z = -1400; z <= 1400; z += 35) {
            const poleGroup = new THREE.Group();
            const pMat = new THREE.MeshStandardMaterial({ color: 0x2c2c2c, metalness: 0.8 });
            const pVert = new THREE.Mesh(new THREE.BoxGeometry(0.25, 8.2, 0.25), pMat);
            pVert.position.set(0, 3.9, 0);
            const pArm = new THREE.Mesh(new THREE.BoxGeometry(4.2, 0.2, 0.2), pMat);
            pArm.position.set(1.3, 7.8, 0);
            poleGroup.add(pVert, pArm);
            poleGroup.position.set(-3.8, 0, z);
            scene.add(poleGroup);
        }

        // 4. 平交道 (前方 60 公尺)
        const crossingZ = -60;
        const crossingGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
        [-2.8, 2.8].forEach(xP => {
            const cp = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 5.8, 12), postMat);
            cp.position.set(xP, 2.8, 0);
            crossingGroup.add(cp);
        });
        const bar = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.14, 0.14), new THREE.MeshStandardMaterial({ color: 0xcc2222 }));
        bar.position.set(0, 4.4, 0);
        crossingGroup.add(bar);
        crossingGroup.position.set(-1.5, 0, crossingZ);
        scene.add(crossingGroup);

        // 5. 列車系統與手動控制變數
        let activeTrain = null;
        let viewMode = 'OUTSIDE'; // 'OUTSIDE', 'CABIN', 'PASSENGER'
        let trainZ = 0;
        let trainSpeed = 0; // 手動控制速度
        
        let controlState = { UP: false, DOWN: false, LEFT: false, RIGHT: false };
        let playerOffset = { x: 0, y: 0, z: 0 };

        function setControl(dir, status) { controlState[dir] = status; }

        // 鍵盤控制支援 (WASD 或方向鍵)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') controlState.UP = true;
            if (e.key === 'ArrowDown' || e.key === 's') controlState.DOWN = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') controlState.LEFT = true;
            if (e.key === 'ArrowRight' || e.key === 'd') controlState.RIGHT = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') controlState.UP = false;
            if (e.key === 'ArrowDown' || e.key === 's') controlState.DOWN = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') controlState.LEFT = false;
            if (e.key === 'ArrowRight' || e.key === 'd') controlState.RIGHT = false;
        });

        function createCarMesh(isHead, bColor, sColor, isFront) {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.2, metalness: 0.4 });
            const stripeMat = new THREE.MeshStandardMaterial({ color: sColor });
            const winMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.05 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const length = 20;

            const floor = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, length - 0.4), floorMat);
            floor.position.set(0, 0.45, 0);
            car.add(floor);

            const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.6, length), bodyMat);
            body.position.set(0, 1.8, 0);
            car.add(body);

            const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.84, 0.35, length), stripeMat);
            stripe.position.set(0, 1.9, 0);
            car.add(stripe);

            const windows = new THREE.Mesh(new THREE.BoxGeometry(2.86, 0.9, length - 4), winMat);
            windows.position.set(0, 2.2, 0);
            car.add(windows);

            if (isHead) {
                const noseZ = isFront ? (length / 2 + 1.6) : (-length / 2 - 1.6);
                const nose = new THREE.Mesh(new THREE.BoxGeometry(2.7, 2.3, 3.2), bodyMat);
                nose.position.set(0, 1.7, noseZ);
                nose.rotation.x = isFront ? -0.28 : 0.28;
                car.add(nose);
            }
            return car;
        }

        function spawnTrain(type) {
            if (activeTrain) scene.remove(activeTrain);
            activeTrain = new THREE.Group();
            let bCol = 0xf0f0f0, sCol = 0x222222;

            if (type === 'PP') { bCol = 0xc0392b; sCol = 0xffffff; }
            else if (type === 'TEMU1000') { bCol = 0xfafafa; sCol = 0xd35400; }
            else if (type === 'TEMU2000') { bCol = 0xb03a2e; sCol = 0xf1c40f; }
            else if (type === 'EMU900') { bCol = 0xeaeded; sCol = 0x16a085; }
            else if (type === 'EMU500') { bCol = 0x2980b9; sCol = 0xf39c12; }

            trainZ = 0;
            trainSpeed = 0;
            for (let i = 0; i < 5; i++) {
                const isHead = (i === 0 || i === 4);
                const car = createCarMesh(isHead, bCol, sCol, i === 0);
                car.position.set(-1.5, 0, (i - 2) * 20.5);
                activeTrain.add(car);
            }

            scene.add(activeTrain);
            document.getElementById('train-menu').style.display = 'none';
            exitToOutside();
            playCrossingSound();
        }

        function toggleTrainMenu() {
            const menu = document.getElementById('train-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function enterCabin() {
            if (!activeTrain) { alert("請先從上方「台鐵車庫」選擇並生成列車！"); return; }
            viewMode = 'CABIN';
            playerOffset = { x: 0, y: 0, z: 0 };
            document.getElementById('controls-panel').style.display = 'grid';
            document.getElementById('info-text').innerText = "【駕駛室】手動駕駛中：按 ▲ 加速前進、▼ 減速/倒車";
        }

        function enterPassengerCar() {
            if (!activeTrain) { alert("請先從上方「台鐵車庫」選擇並生成列車！"); return; }
            viewMode = 'PASSENGER';
            playerOffset = { x: 0, y: 0, z: 0 };
            document.getElementById('controls-panel').style.display = 'grid';
            document.getElementById('info-text').innerText = "【客車內】已進入車廂走道，可使用方向鍵走動";
        }

        function exitToOutside() {
            viewMode = 'OUTSIDE';
            document.getElementById('controls-panel').style.display = 'none';
            camera.position.set(8, 4, 16);
            camera.lookAt(-1.5, 1, 0);
            document.getElementById('info-text').innerText = "場景：臺鐵歸來車站 (外部視角) | 請點車庫生成列車";
        }

        // 6. 主迴圈 (手動駕駛物理與相機更新)
        function animate() {
            requestAnimationFrame(animate);

            // 手動加速與煞車邏輯
            if (activeTrain) {
                if (controlState.UP) trainSpeed -= 0.015; // 往前開
                if (controlState.DOWN) trainSpeed += 0.015; // 往後/煞車
                
                // 自然阻力摩擦
                trainSpeed *= 0.98;

                // 限制最高速
                if (trainSpeed > 0.8) trainSpeed = 0.8;
                if (trainSpeed < -0.8) trainSpeed = -0.8;

                trainZ += trainSpeed;
                activeTrain.position.z = trainZ;

                // 內部走動微調
                const walkSpeed = 0.1;
                if (viewMode === 'PASSENGER' || viewMode === 'CABIN') {
                    if (controlState.LEFT) playerOffset.x -= walkSpeed;
                    if (controlState.RIGHT) playerOffset.x += walkSpeed;
                }
            }

            // 視角鏡頭跟隨
            if (activeTrain) {
                if (viewMode === 'CABIN') {
                    const cabinX = -1.5;
                    const cabinY = 1.8;
                    const cabinZ = trainZ + 10;
                    camera.position.set(cabinX + playerOffset.x, cabinY + playerOffset.y, cabinZ + playerOffset.z);
                    camera.lookAt(cabinX + playerOffset.x, cabinY + playerOffset.y, cabinZ + playerOffset.z - 30);
                } else if (viewMode === 'PASSENGER') {
                    const carX = -1.5;
                    const carY = 1.3;
                    const carZ = trainZ;
                    camera.position.set(carX + playerOffset.x, carY + playerOffset.y, carZ + playerOffset.z);
                    camera.lookAt(carX + playerOffset.x, carY + playerOffset.y, carZ + playerOffset.z - 20);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
