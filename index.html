<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中台鐵路模擬器 - Chunghtai Railway Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87ceeb; user-select: none; }
        canvas { display: block; }
        
        /* 模仿真實模擬器的 HUD 介面 */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            font-family: monospace, sans-serif;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 8px;
            pointer-events: none;
            max-width: 90%;
            border-left: 5px solid #ff9800;
        }
        #hud h3 { margin: 0 0 5px 0; font-size: 16px; color: #ff9800; }
        #hud p { margin: 3px 0; font-size: 13px; }

        /* 廣播字幕提示條 (模仿影片進站廣播) */
        #announcement {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 152, 0, 0.9);
            color: black;
            font-weight: bold;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* 底部駕駛控制板 */
        .controls {
            position: absolute;
            bottom: 25px;
            right: 25px;
            display: flex;
            gap: 15px;
        }
        .ctrl-btn {
            background: #2196F3;
            color: white;
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:active { transform: scale(0.92); }
        #btn-brake { background: #f44336; }
        #btn-power { background: #4CAF50; }
    </style>
</head>
<body>
    <div id="hud">
        <h3>中台鐵路模擬器 (Chunghtai Railway)</h3>
        <p id="station-info">下一站：中央車站 (Central Station)</p>
        <p id="status-info">狀態：行駛中 | 速度：0 km/h</p>
    </div>

    <div id="announcement">📢 Stand clear of moving train please</div>

    <div class="controls">
        <button class="ctrl-btn" id="btn-brake">煞車</button>
        <button class="ctrl-btn" id="btn-power">動力</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.DirectionalLight(0xffffff, 1).position.set(10, 20, 10));
        scene.add(new THREE.AmbientLight(0x505050));

        // 1. 鐵路軌道迴圈路徑
        const curve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-40, 0, 0),
            new THREE.Vector3(-20, 0, -25),
            new THREE.Vector3(20, 0, -25),
            new THREE.Vector3(40, 0, 0),
            new THREE.Vector3(20, 0, 25),
            new THREE.Vector3(-20, 0, 25),
        ], true);

        const trackPoints = curve.getPoints(120);
        const trackGeo = new THREE.BufferGeometry().setFromPoints(trackPoints);
        const trackLine = new THREE.Line(trackGeo, new THREE.LineBasicMaterial({ color: 0x333333 }));
        scene.add(trackLine);

        // 2. 模擬車站月台
        const platformGeo = new THREE.BoxGeometry(16, 0.6, 3);
        const platformMat = new THREE.MeshStandardMaterial({ color: 0x9e9e9e });
        const platform = new THREE.Mesh(platformGeo, platformMat);
        platform.position.set(20, 0.3, -3);
        scene.add(platform);

        // 3. 火車物件 (台鐵自強號藍白紅風格)
        const trainGroup = new THREE.Group();
        const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1.4, 4.5), new THREE.MeshStandardMaterial({ color: 0xffffff }));
        body.position.y = 0.7;
        trainGroup.add(body);
        
        const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.02, 0.3, 4.52), new THREE.MeshStandardMaterial({ color: 0xd32f2f }));
        stripe.position.y = 0.8;
        trainGroup.add(stripe);
        scene.add(trainGroup);

        // 遊戲控制變數
        let progress = 0;
        let speed = 0;
        let targetSpeed = 0.0015;
        let isStoppedAtStation = false;

        const stationInfo = document.getElementById('station-info');
        const statusInfo = document.getElementById('status-info');
        const announcement = document.getElementById('announcement');

        // 按鈕事件
        const powerBtn = document.getElementById('btn-power');
        const brakeBtn = document.getElementById('btn-brake');

        powerBtn.addEventListener('touchstart', () => { if(!isStoppedAtStation) targetSpeed = 0.003; });
        powerBtn.addEventListener('touchend', () => { if(!isStoppedAtStation) targetSpeed = 0.0015; });
        powerBtn.addEventListener('mousedown', () => { if(!isStoppedAtStation) targetSpeed = 0.003; });
        powerBtn.addEventListener('mouseup', () => { if(!isStoppedAtStation) targetSpeed = 0.0015; });

        brakeBtn.addEventListener('touchstart', () => { targetSpeed = 0; });
        brakeBtn.addEventListener('mousedown', () => { targetSpeed = 0; });

        function update() {
            speed += (targetSpeed - speed) * 0.05;
            progress += speed;
            if (progress > 1) progress = 0;

            const pos = curve.getPointAt(progress);
            const tangent = curve.getTangentAt(progress);

            trainGroup.position.copy(pos);
            trainGroup.position.y += 0.7;
            trainGroup.lookAt(pos.clone().add(tangent));
            trainGroup.rotateY(Math.PI);

            // 模擬接近車站與廣播提示 (當進度大約經過月台區間)
            if (progress > 0.35 && progress < 0.45) {
                if (!isStoppedAtStation && speed > 0.0005) {
                    // 自動進站停車
                    targetSpeed = 0;
                    isStoppedAtStation = true;
                    stationInfo.innerText = "本站：中央車站 (Central Station)";
                    statusInfo.innerText = "狀態：到站開門中 (上下客)";
                    announcement.style.display = "block"; // 顯示英文廣播提示

                    // 模擬 3 秒後發車
                    setTimeout(() => {
                        targetSpeed = 0.0015;
                        isStoppedAtStation = false;
                        announcement.style.display = "none";
                        statusInfo.innerText = "狀態：離站行駛中";
                    }, 3500);
                }
            } else if (progress > 0.5 && progress < 0.55) {
                stationInfo.innerText = "下一站：阿里林場線 (Ali Forest Line)";
            }

            let speedKmH = Math.round(speed * 35000);
            if (!isStoppedAtStation) {
                statusInfo.innerText = `狀態：行駛中 | 速度：${speedKmH} km/h`;
            }

            // 追隨視角
            const camOffset = new THREE.Vector3(0, 3.5, -9).applyQuaternion(trainGroup.quaternion);
            camera.position.copy(pos).add(camOffset);
            camera.position.y = pos.y + 3.5;
            camera.lookAt(pos);
        }

        function animate() {
            requestAnimationFrame(animate);
            update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
