<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易網頁 3D 鐵路模擬器雛形</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>3D 鐵路模擬器雛形</h3>
        <p>這是使用 Three.js 創建的第一步。</p>
        <p>提示：按 W 鍵讓火車向前移動。</p>
    </div>

    <!-- 引入 Three.js 函式庫 (使用 CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // --- 基礎場景設定 ---
        const scene = new THREE.Scene();
        // 設定天空顏色
        scene.background = new THREE.Color(0x87ceeb); 

        // 設定相機 (視角)
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10); // 相機位置 (x, y, z)
        camera.lookAt(0, 0, 0); // 相機看向場景中心

        // 設定渲染器 (把 3D 畫出來的東西)
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 加入燈光
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(5, 10, 7.5);
        scene.add(light);
        const ambientLight = new THREE.AmbientLight(0x404040); // 環境光
        scene.add(ambientLight);

        // --- 建立遊戲物件 ---

        // 1. 建立軌道 (簡單的灰色長方體)
        const trackGeometry = new THREE.BoxGeometry(20, 0.2, 1);
        const trackMaterial = new THREE.MeshStandardMaterial({ color: 0x555555 }); // 深灰色
        const track = new THREE.Mesh(trackGeometry, trackMaterial);
        track.position.set(0, -0.1, 0); // 稍微往下放
        scene.add(track);

        // 2. 建立火車 (紅色的長方體)
        const trainGeometry = new THREE.BoxGeometry(2, 1.5, 1);
        const trainMaterial = new THREE.MeshStandardMaterial({ color: 0xff0000 }); // 紅色
        const train = new THREE.Mesh(trainGeometry, trainMaterial);
        train.position.set(-9, 0.75, 0); // 放在軌道左端
        scene.add(train);

        // --- 互動邏輯 ---

        // 監聽鍵盤事件
        let trainSpeed = 0;
        const keys = {};

        window.addEventListener('keydown', (event) => {
            keys[event.code] = true;
        });
        window.addEventListener('keyup', (event) => {
            keys[event.code] = false;
        });

        // 更新遊戲狀態的函數
        function update() {
            // 如果按下 W 鍵
            if (keys['KeyW']) {
                trainSpeed = 0.1; // 設定速度
            } else {
                trainSpeed = 0; // 沒按就停下來
            }

            // 移動火車
            train.position.x += trainSpeed;

            // 簡單邊界檢查 (跑出畫面就重置)
            if (train.position.x > 10) {
                train.position.x = -9;
            }
        }

        // --- 動畫迴圈 (讓畫面動起來) ---
        function animate() {
            requestAnimationFrame(animate); // 告訴瀏覽器每一幀都呼叫這個函數

            // 執行遊戲邏輯更新
            update();

            // 渲染畫面 (讓相機拍下當前場景)
            renderer.render(scene, camera);
        }

        // 開始執行動畫迴圈
        animate();

        // 視窗大小改變時自動調整畫面
        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
