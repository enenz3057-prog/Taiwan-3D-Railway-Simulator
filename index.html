<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福爾魔沙鐵路模擬器 - Roblox 風格擬真版</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
            touch-action: none;
        }
        /* 頂部選單列 */
        .top-btns {
            position: absolute;
            top: 12px;
            right: 12px;
            left: 12px;
            z-index: 20;
            display: flex;
            justify-content: space-between;
            gap: 6px;
        }
        .action-btn {
            background-color: #2ecc71;
            color: #fff;
            padding: 9px 8px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            flex: 1;
            text-align: center;
            transition: background 0.2s;
        }
        .action-btn:hover { background-color: #27ae60; }
        .drive-btn { background-color: #e67e22; }
        .board-btn { background-color: #3498db; }
        .outside-btn { background-color: #9b59b6; }
        .join-btn { background-color: #5865F2; }

        /* 手動駕駛 / 行走控制虛擬按鍵 (Roblox UI 風格) */
        #controls-panel {
            position: absolute;
            bottom: 30px;
            left: 30px;
            z-index: 25;
            display: none;
            grid-template-columns: repeat(3, 56px);
            grid-template-rows: repeat(2, 56px);
            gap: 8px;
        }
        .ctrl-btn {
            background: rgba(20, 20, 20, 0.85);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            font-size: 20px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            outline: none;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .ctrl-btn:active { background: rgba(46, 204, 113, 0.9); transform: scale(0.95); }
        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }

        /* 車庫選單 */
        #train-menu {
            position: absolute;
            top: 65px;
            right: 12px;
            left: 12px;
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid #444;
            border-radius: 10px;
            padding: 12px;
            display: none;
            z-index: 30;
            text-align: left;
            max-height: 65vh;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.7);
        }
        #train-menu h3 { margin: 0 0 6px 0; font-size: 14px; color: #f1c40f; }
        #train-menu h4 { margin: 10px 0 4px 0; font-size: 12px; color: #2ecc71; border-bottom: 1px solid #444; padding-bottom: 3px; }
        #train-menu button {
            display: block; width: 100%; background: #2c2c2c; color: #fff; border: none; padding: 9px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: left;
        }
        #train-menu button:hover { background: #444; }

        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; }
        
        /* Roblox 風格資訊面板 */
        .info {
            position: absolute; bottom: 12px; left: 12px; right: 12px; font-size: 12px; color: #fff; z-index: 10; pointer-events: none; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 6px; border-left: 4px solid #f1c40f; text-align: left;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="top-btns">
        <button class="action-btn" onclick="toggleTrainMenu()">🚂 臺鐵車庫</button>
        <button class="action-btn drive-btn" onclick="enterCabin()">🕹️ 駕駛室</button>
        <button class="action-btn board-btn" onclick="enterPassengerCar()">👥 上車</button>
        <button class="action-btn outside-btn" onclick="exitToOutside()">👁️ 外部視角</button>
        <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="action-btn join-btn">💬 加入群組</a>
    </div>

    <!-- 手動控制虛擬按鍵 -->
    <div id="controls-panel">
        <button class="ctrl-btn btn-up" ontouchstart="setControl('UP', true)" ontouchend="setControl('UP', false)" onmousedown="setControl('UP', true)" onmouseup="setControl('UP', false)">▲</button>
        <button class="ctrl-btn btn-left" ontouchstart="setControl('LEFT', true)" ontouchend="setControl('LEFT', false)" onmousedown="setControl('LEFT', true)" onmouseup="setControl('LEFT', false)">◀</button>
        <button class="ctrl-btn btn-down" ontouchstart="setControl('DOWN', true)" ontouchend="setControl('DOWN', false)" onmousedown="setControl('DOWN', true)" onmouseup="setControl('DOWN', false)">▼</button>
        <button class="ctrl-btn btn-right" ontouchstart="setControl('RIGHT', true)" ontouchend="setControl('RIGHT', false)" onmousedown="setControl('RIGHT', true)" onmouseup="setControl('RIGHT', false)">▶</button>
    </div>

    <!-- 車庫選單 -->
    <div id="train-menu">
        <h3>福爾魔沙鐵路 - 車型資料庫</h3>
        <h4>1. 城際自強號系列</h4>
        <button onclick="spawnTrain('EMU3000')">EMU3000 新自強號 (美學黑白)</button>
        <button onclick="spawnTrain('PP')">E1000 推拉式自強號 (經典紅)</button>
        <button onclick="spawnTrain('TEMU1000')">TEMU1000 太魯閣號</button>
        <button onclick="spawnTrain('TEMU2000')">TEMU2000 普悠瑪號</button>
        <h4>2. 通勤電聯車系列</h4>
        <button onclick="spawnTrain('EMU900')">EMU900 新一代區間車 (郊區綠)</button>
        <button onclick="spawnTrain('EMU500')">EMU500 經典藍黃區間車</button>
    </div>

    <div id="canvas-container"></div>
    <div class="info" id="info-text">福爾魔沙鐵路模擬器 | 狀態：等待車輛調度。請點擊右上角「臺鐵車庫」選擇列車！</div>

    <script>
        let audioCtx = null, crossingInterval = null, isCrossingActive = false;

        function initAudio() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
        }

        function playCrossingSound() {
            initAudio();
            if (isCrossingActive || !audioCtx) return;
            isCrossingActive = true;
            let high = true;
            crossingInterval = setInterval(() => {
                if (!audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.frequency.value = high ? 780 : 620;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                    high = !high;
                } catch(e) {}
            }, 500);
        }

        // 1. 3D 場景與渲染設定
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x75bbfd); // Roblox 天空藍
        scene.fog = new THREE.FogExp2(0x75bbfd, 0.0006);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 4000);
        camera.position.set(10, 5, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const sun = new THREE.DirectionalLight(0xfff5e6, 1.3);
        sun.position.set(60, 90, 40);
        sun.castShadow = true;
        scene.add(sun);

        // 2. 廣闊地形、月台與車站
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(6000, 6000),
            new THREE.MeshStandardMaterial({ color: 0x558b2f }) // 擬真草皮
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.45;
        scene.add(ground);

        // 側式月台
        const platform = new THREE.Mesh(
            new THREE.BoxGeometry(5.5, 0.6, 2000),
            new THREE.MeshStandardMaterial({ color: 0xe0e0e0 })
        );
        platform.position.set(4.5, -0.2, 0);
        scene.add(platform);

        // 車站站房與周邊房舍
        const stationGroup = new THREE.Group();
        const bMat = new THREE.MeshStandardMaterial({ color: 0xfafafa });
        const rMat = new THREE.MeshStandardMaterial({ color: 0x8e44ad });
        const mainStation = new THREE.Mesh(new THREE.BoxGeometry(18, 7, 12), bMat);
        mainStation.position.set(14, 3.2, -20);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(12, 4, 4), rMat);
        roof.position.set(14, 8.5, -20);
        roof.rotation.y = Math.PI / 4;
        stationGroup.add(mainStation, roof);

        // 周邊建築
        for (let i = -4; i <= 4; i++) {
            if (i === 0) continue;
            const house = new THREE.Mesh(
                new THREE.BoxGeometry(9, 6, 11),
                new THREE.MeshStandardMaterial({ color: 0xd35400 + i * 111 })
            );
            house.position.set(18 + (i * 14), 2.5, i * 60);
            stationGroup.add(house);
        }
        scene.add(stationGroup);

        // 3. 超長鐵軌與鋼構電線杆、高壓電線
        const trackGroup = new THREE.Group();
        const tieMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
        const railMat = new THREE.MeshStandardMaterial({ color: 0x95a5a6, metalness: 0.9 });

        for (let z = -2000; z <= 2000; z += 1.0) {
            const tie = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.12, 0.4), tieMat);
            tie.position.set(0, -0.35, z);
            trackGroup.add(tie);
        }
        [-0.75, 0.75].forEach(x => {
            const rail = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.14, 4002), railMat);
            rail.position.set(x, -0.07, 0);
            trackGroup.add(rail);
        });
        trackGroup.position.x = -1.5;
        scene.add(trackGroup);

        // H型電線杆與架空懸臂
        for (let z = -1800; z <= 1800; z += 35) {
            const poleGroup = new THREE.Group();
            const pMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });
            const pVert = new THREE.Mesh(new THREE.BoxGeometry(0.25, 8.5, 0.25), pMat);
            pVert.position.set(0, 4.0, 0);
            const pArm = new THREE.Mesh(new THREE.BoxGeometry(4.3, 0.2, 0.2), pMat);
            pArm.position.set(1.3, 8.0, 0);
            poleGroup.add(pVert, pArm);
            poleGroup.position.set(-3.8, 0, z);
            scene.add(poleGroup);
        }

        // 4. 自動警報平交道 (前方 70 公尺)
        const crossingZ = -70;
        const crossingGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        [-2.8, 2.8].forEach(xP => {
            const cp = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 6.0, 12), postMat);
            cp.position.set(xP, 2.9, 0);
            crossingGroup.add(cp);
        });
        const bar = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.14, 0.14), new THREE.MeshStandardMaterial({ color: 0xc0392b }));
        bar.position.set(0, 4.5, 0);
        crossingGroup.add(bar);
        crossingGroup.position.set(-1.5, 0, crossingZ);
        scene.add(crossingGroup);

        // 5. 列車動態系統與手動控制
        let activeTrain = null;
        let viewMode = 'OUTSIDE'; // 'OUTSIDE', 'CABIN', 'PASSENGER'
        let trainZ = 0;
        let trainSpeed = 0; // 手動速度
        let controlState = { UP: false, DOWN: false, LEFT: false, RIGHT: false };
        let playerOffset = { x: 0, y: 0, z: 0 };

        function setControl(dir, status) { controlState[dir] = status; }

        // 鍵盤操控綁定 (WASD / 方向鍵)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') controlState.UP = true;
            if (e.key === 'ArrowDown' || e.key === 's') controlState.DOWN = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') controlState.LEFT = true;
            if (e.key === 'ArrowRight' || e.key === 'd') controlState.RIGHT = true;
        });
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') controlState.UP = false;
            if (e.key === 'ArrowDown' || e.key === 's') controlState.DOWN = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') controlState.LEFT = false;
            if (e.key === 'ArrowRight' || e.key === 'd') controlState.RIGHT = false;
        });

        function createCarMesh(isHead, bColor, sColor, isFront) {
            const car = new THREE.Group();
            const bodyMat = new THREE.MeshStandardMaterial({ color: bColor, roughness: 0.2, metalness: 0.4 });
            const stripeMat = new THREE.MeshStandardMaterial({ color: sColor });
            const winMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.05 });
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
            const length = 20;

            // 車內地板
            const floor = new THREE.Mesh(new THREE.BoxGeometry(2.6, 0.1, length - 0.4), floorMat);
            floor.position.set(0, 0.45, 0);
            car.add(floor);

            // 車身
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.8, 2.6, length), bodyMat);
            body.position.set(0, 1.8, 0);
            car.add(body);

            // 腰線
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(2.84, 0.35, length), stripeMat);
            stripe.position.set(0, 1.9, 0);
            car.add(stripe);

            // 車窗
            const windows = new THREE.Mesh(new THREE.BoxGeometry(2.86, 0.9, length - 4), winMat);
            windows.position.set(0, 2.2, 0);
            car.add(windows);

            // 流線車頭
            if (isHead) {
                const noseZ = isFront ? (length / 2 + 1.6) : (-length / 2 - 1.6);
                const nose = new THREE.Mesh(new THREE.BoxGeometry(2.7, 2.3, 3.2), bodyMat);
                nose.position.set(0, 1.7, noseZ);
                nose.rotation.x = isFront ? -0.28 : 0.28;
                car.add(nose);
            }
            return car;
        }

        function spawnTrain(type) {
            if (activeTrain) scene.remove(activeTrain);
            activeTrain = new THREE.Group();
            let bCol = 0xf0f0f0, sCol = 0x222222;

            if (type === 'PP') { bCol = 0xc0392b; sCol = 0xffffff; }
            else if (type === 'TEMU1000') { bCol = 0xfafafa; sCol = 0xd35400; }
            else if (type === 'TEMU2000') { bCol = 0xb03a2e; sCol = 0xf1c40f; }
            else if (type === 'EMU900') { bCol = 0xeaeded; sCol = 0x16a085; }
            else if (type === 'EMU500') { bCol = 0x2980b9; sCol = 0xf39c12; }

            trainZ = 0;
            trainSpeed = 0;
            for (let i = 0; i < 5; i++) {
                const isHead = (i === 0 || i === 4);
                const car = createCarMesh(isHead, bCol, sCol, i === 0);
                car.position.set(-1.5, 0, (i - 2) * 20.5);
                activeTrain.add(car);
            }

            scene.add(activeTrain);
            document.getElementById('train-menu').style.display = 'none';
            exitToOutside();
            playCrossingSound();
            document.getElementById('info-text').innerText = `已調度列車 [${type}] | 請點擊「駕駛室」或使用 ▲▼ 鍵手動駕駛！`;
        }

        function toggleTrainMenu() {
            const menu = document.getElementById('train-menu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }

        function enterCabin() {
            if (!activeTrain) { alert("請先從上方「臺鐵車庫」選擇並生成列車！"); return; }
            viewMode = 'CABIN';
            playerOffset = { x: 0, y: 0, z: 0 };
            document.getElementById('controls-panel').style.display = 'grid';
            document.getElementById('info-text').innerText = "【駕駛室視角】手動駕駛中：按 ▲ 加速前進、▼ 減速/倒車";
        }

        function enterPassengerCar() {
            if (!activeTrain) { alert("請先從上方「臺鐵車庫」選擇並生成列車！"); return; }
            viewMode = 'PASSENGER';
            playerOffset = { x: 0, y: 0, z: 0 };
            document.getElementById('controls-panel').style.display = 'grid';
            document.getElementById('info-text').innerText = "【客車內視角】已進入車廂走道，可使用方向鍵自由走動";
        }

        function exitToOutside() {
            viewMode = 'OUTSIDE';
            document.getElementById('controls-panel').style.display = 'none';
            camera.position.set(10, 5, 18);
            camera.lookAt(-1.5, 1, 0);
            document.getElementById('info-text').innerText = "福爾魔沙鐵路模擬器 | 目前為車站外部視角";
        }

        // 6. 主渲染與物理迴圈
        function animate() {
            requestAnimationFrame(animate);

            if (activeTrain) {
                // 手動控制物理運算
                if (controlState.UP) trainSpeed -= 0.015;
                if (controlState.DOWN) trainSpeed += 0.015;
                
                trainSpeed *= 0.985; // 阻力摩擦

                if (trainSpeed > 0.85) trainSpeed = 0.85;
                if (trainSpeed < -0.85) trainSpeed = -0.85;

                trainZ += trainSpeed;
                activeTrain.position.z = trainZ;

                // 車內/駕駛室走動微調
                const walkSpeed = 0.12;
                if (viewMode === 'PASSENGER' || viewMode === 'CABIN') {
                    if (controlState.LEFT) playerOffset.x -= walkSpeed;
                    if (controlState.RIGHT) playerOffset.x += walkSpeed;
                }
            }

            // 視角鏡頭精準跟隨
            if (activeTrain) {
                if (viewMode === 'CABIN') {
                    const cabinX = -1.5;
                    const cabinY = 1.8;
                    const cabinZ = trainZ + 10;
                    camera.position.set(cabinX + playerOffset.x, cabinY + playerOffset.y, cabinZ + playerOffset.z);
                    camera.lookAt(cabinX + playerOffset.x, cabinY + playerOffset.y, cabinZ + playerOffset.z - 35);
                } else if (viewMode === 'PASSENGER') {
                    const carX = -1.5;
                    const carY = 1.3;
                    const carZ = trainZ;
                    camera.position.set(carX + playerOffset.x, carY + playerOffset.y, carZ + playerOffset.z);
                    camera.lookAt(carX + playerOffset.x, carY + playerOffset.y, carZ + playerOffset.z - 25);
                }
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
