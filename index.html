<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣鐵路風情錄 - 車站與列車介紹</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #1b3b6f, #218380);
            color: white;
            text-align: center;
            padding: 2.5rem 1rem;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }
        .card-content {
            padding: 1.5rem;
        }
        .card-content h2 {
            font-size: 1.4rem;
            color: #1b3b6f;
            margin-bottom: 0.8rem;
        }
        .card-content p {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 1rem;
        }
        .tag {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        footer {
            text-align: center;
            padding: 1.5rem;
            background: #2d3748;
            color: white;
            margin-top: 3rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>台灣鐵路風情錄</h1>
        <p>記錄經典列車與現代化鐵道風貌</p>
    </header>

    <div class="container">
        <!-- 卡片一：經典列車 -->
        <div class="card">
            <img src="1000005437.jpg" alt="台鐵列車舊貌">
            <div class="card-content">
                <h2>經典列車風貌</h2>
                <p>承載無數旅客記憶的台鐵經典車廂，帶著獨特的藍色塗裝與復古月台交織出濃厚的情懷與歷史感。</p>
                <span class="tag">鐵道文化</span>
            </div>
        </div>

        <!-- 卡片二：現代化高架車站 -->
        <div class="card">
            <img src="1000005435.jpg" alt="高架化車站月台">
            <div class="card-content">
                <h2>現代化高架月台</h2>
                <p>隨著鐵路立體化工程，全新的高架車站月台擁有寬敞的視野、現代化的電車線桿與乾淨的候車環境。</p>
                <span class="tag">鐵道建設</span>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 鐵道網頁專案. All Rights Reserved.</p>
    </footer>

</body>
</html>
