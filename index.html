<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <title>台灣3D鐵路模擬器 - 電桿實景版</title>
    <style>
        body {
            background-color: #557799;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            margin: 0;
            line-height: 40px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .join-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2;
            color: #fff;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #ddd;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>
    <div id="canvas-container"></div>
    <div class="info">軌距設定：1067mm 臺鐵雙線電桿實景版</div>

    <script>
        // 1. 建立場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x667788);
        scene.fog = new THREE.FogExp2(0x667788, 0.012);

        // 2. 建立相機
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.6, 6);
        camera.lookAt(0, 1.2, -20);

        // 3. 建立渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 自然光影
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffee, 1.3);
        sunLight.position.set(10, 25, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 5. 建立立體碎石道床
        const stoneGeo = new THREE.DodecahedronGeometry(0.14, 0);
        const stoneMats = [
            new THREE.MeshStandardMaterial({ color: 0x6e6a65, roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0x524e49, roughness: 0.85 }),
            new THREE.MeshStandardMaterial({ color: 0x827d76, roughness: 0.75 }),
            new THREE.MeshStandardMaterial({ color: 0x3d3a36, roughness: 0.9 })
        ];

        const lengthRows = 250;
        const widthCols = 28;
        
        for (let r = 0; r < lengthRows; r++) {
            const zPos = (r - lengthRows / 2) * 0.4;
            for (let c = 0; c < widthCols; c++) {
                const xPos = (c - widthCols / 2) * 0.26;
                if (Math.abs(xPos) < 4.2) {
                    const mat = stoneMats[Math.floor(Math.random() * stoneMats.length)];
                    const stone = new THREE.Mesh(stoneGeo, mat);
                    const yPos = -0.35 + (Math.random() * 0.08);
                    
                    stone.position.set(xPos + (Math.random()-0.5)*0.08, yPos, zPos + (Math.random()-0.5)*0.08);
                    stone.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                    
                    const scale = 0.6 + Math.random() * 0.7;
                    stone.scale.set(scale, scale * 0.6, scale);
                    
                    stone.castShadow = true;
                    stone.receiveShadow = true;
                    scene.add(stone);
                }
            }
        }

        // 6. 鐵鏽色金屬鋼軌
        const railMat = new THREE.MeshStandardMaterial({ 
            color: 0x8c5b3e, 
            metalness: 0.85, 
            roughness: 0.3, 
            emissive: 0x221105 
        });

        function createRail() {
            const railGroup = new THREE.Group();
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 110), railMat);
            head.position.y = 0.31;
            head.castShadow = true;
            railGroup.add(head);

            const web = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 110), railMat);
            web.position.y = 0.16;
            web.castShadow = true;
            railGroup.add(web);

            const base = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 110), railMat);
            base.position.y = 0.04;
            base.castShadow = true;
            railGroup.add(base);

            return railGroup;
        }

        const trackOffset = 1.6; 
        scene.add(Object.assign(createRail(), { position: { x: -trackOffset - 1.067/2 } }));
        // 為了確保位置正確設定
        const l1 = createRail(); l1.position.x = -trackOffset - 1.067/2; scene.add(l1);
        const l2 = createRail(); l2.position.x = -trackOffset + 1.067/2; scene.add(l2);
        const r1 = createRail(); r1.position.x = trackOffset - 1.067/2; scene.add(r1);
        const r2 = createRail(); r2.position.x = trackOffset + 1.067/2; scene.add(r2);

        // 7. 灰色水泥枕木
        const sleeperGeo = new THREE.BoxGeometry(2.4, 0.18, 0.45);
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.75 });
        
        const sleeperCount = 110;
        const sleeperSpacing = 0.8;
        
        for (let i = 0; i < sleeperCount; i++) {
            const zPos = (i - sleeperCount / 2) * sleeperSpacing;
            
            const s1 = new THREE.Mesh(sleeperGeo, sleeperMat);
            s1.position.set(-trackOffset, -0.02, zPos);
            s1.castShadow = true; s1.receiveShadow = true;
            scene.add(s1);

            const s2 = new THREE.Mesh(sleeperGeo, sleeperMat);
            s2.position.set(trackOffset, -0.02, zPos);
            s2.castShadow = true; s2.receiveShadow = true;
            scene.add(s2);
        }

        // 8. 【新增：鐵路電車線桿與架空線】
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.3 });
        const wireMat = new THREE.LineBasicMaterial({ color: 0x222222 });

        const poleInterval = 15; // 每 15 公尺立一根電桿
        for (let z = -50; z <= 50; z += poleInterval) {
            // 左側電桿
            const leftPole = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6, 0.3), poleMat);
            leftPole.position.set(-4.5, 3, z);
            leftPole.castShadow = true;
            scene.add(leftPole);

            // 右側電桿
            const rightPole = new THREE.Mesh(new THREE.BoxGeometry(0.3, 6, 0.3), poleMat);
            rightPole.position.set(4.5, 3, z);
            rightPole.castShadow = true;
            scene.add(rightPole);

            // 橫跨鐵道上方的懸臂梁
            const arm = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.2, 0.2), poleMat);
            arm.position.set(0, 5.8, z);
            arm.castShadow = true;
            scene.add(arm);
        }

        // 9. 渲染迴圈
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
