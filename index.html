<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣3D鐵路模擬器 - 臺鐵歸來車站</title>
    <style>
        body {
            background-color: #557799;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            margin: 0;
            line-height: 40px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .join-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2;
            color: #fff;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #ddd;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>
    <div id="canvas-container"></div>
    <div class="info">場景：臺鐵高架車站（歸來站視角） | 模擬引擎：Three.js</div>

    <script>
        // 1. 建立場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x4a7a9d); // 更真實的晴空藍
        scene.fog = new THREE.FogExp2(0x4a7a9d, 0.008); 

        // 2. 建立相機（完美對齊照片中月台上的視角）
        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.2, 1.7, 8.0); 
        camera.lookAt(2.2, 1.7, -20); 

        // 3. 建立渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 自然光影
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.4);
        sunLight.position.set(15, 30, 15);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 5. 軌道區塊（道碴、鋼軌、枕木）
        const stoneGeo = new THREE.DodecahedronGeometry(0.14, 0);
        const stoneMats = [
            new THREE.MeshStandardMaterial({ color: 0x6e6a65, roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0x524e49, roughness: 0.85 }),
            new THREE.MeshStandardMaterial({ color: 0x827d76, roughness: 0.75 })
        ];

        for (let r = 0; r < 350; r++) {
            const zPos = (r - 175) * 0.4;
            for (let c = 0; c < 24; c++) {
                const xPos = (c - 12) * 0.26 - 1.2;
                if (Math.abs(xPos + 1.2) < 3.8) {
                    const mat = stoneMats[Math.floor(Math.random() * stoneMats.length)];
                    const stone = new THREE.Mesh(stoneGeo, mat);
                    stone.position.set(xPos + (Math.random()-0.5)*0.08, -0.35 + Math.random()*0.05, zPos);
                    stone.scale.setScalar(0.6 + Math.random() * 0.6);
                    stone.castShadow = true;
                    stone.receiveShadow = true;
                    scene.add(stone);
                }
            }
        }

        const railMat = new THREE.MeshStandardMaterial({ color: 0x8c5b3e, metalness: 0.85, roughness: 0.3 });
        function createRail() {
            const group = new THREE.Group();
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.12, 140), railMat); head.position.y = 0.31;
            const web = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.2, 140), railMat); web.position.y = 0.16;
            const base = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.08, 140), railMat); base.position.y = 0.04;
            group.add(head, web, base);
            return group;
        }
        const trackOffset = 1.6;
        const l1 = createRail(); l1.position.x = -trackOffset - 0.53; scene.add(l1);
        const l2 = createRail(); l2.position.x = -trackOffset + 0.53; scene.add(l2);
        const r1 = createRail(); r1.position.x = trackOffset - 0.53; scene.add(r1);
        const r2 = createRail(); r2.position.x = trackOffset + 0.53; scene.add(r2);

        const sleeperGeo = new THREE.BoxGeometry(2.4, 0.18, 0.45);
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.75 });
        for (let i = 0; i < 150; i++) {
            const zPos = (i - 75) * 0.9;
            const s1 = new THREE.Mesh(sleeperGeo, sleeperMat); s1.position.set(-trackOffset, -0.02, zPos); s1.castShadow = true;
            const s2 = new THREE.Mesh(sleeperGeo, sleeperMat); s2.position.set(trackOffset, -0.02, zPos); s2.castShadow = true;
            scene.add(s1, s2);
        }

        // 6. 高架車站月台與黃色導盲磚
        const platformMat = new THREE.MeshStandardMaterial({ color: 0xe0e0e0, roughness: 0.8 }); // 淺灰色水泥月台面
        const platform = new THREE.Mesh(new THREE.BoxGeometry(5.5, 0.8, 140), platformMat);
        platform.position.set(4.5, -0.4, 0);
        platform.castShadow = true; platform.receiveShadow = true;
        scene.add(platform);

        // 黃色導盲磚列
        const tileMat = new THREE.MeshStandardMaterial({ color: 0xd4a017, roughness: 0.6 });
        const tactileTile = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.82, 140), tileMat);
        tactileTile.position.set(2.05, -0.38, 0);
        scene.add(tactileTile);

        // 月台外側白色護欄牆
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.9 });
        const platformWall = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.4, 140), wallMat);
        platformWall.position.set(7.1, 0.3, 0);
        platformWall.castShadow = true;
        scene.add(platformWall);

        // 7. 照片中的歸來車站綠色站名牌
        const signGroup = new THREE.Group();
        const postMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const post1 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.2, 0.08), postMat); post1.position.set(-0.6, 0.5, 0);
        const post2 = new THREE.Mesh(new THREE.BoxGeometry(0.08, 2.2, 0.08), postMat); post2.position.set(0.6, 0.5, 0);
        
        // 製作綠白相間站名牌板子
        const boardGeo = new THREE.BoxGeometry(1.4, 0.8, 0.05);
        const boardMat = new THREE.MeshStandardMaterial({ color: 0x006633 }); // 臺鐵特有綠色
        const signBoard = new THREE.Mesh(boardGeo, boardMat);
        signBoard.position.set(0, 1.2, 0);
        signGroup.add(post1, post2, signBoard);
        signGroup.position.set(3.2, 0, -5);
        signGroup.rotation.y = -0.3;
        scene.add(signGroup);

        // 8. 照片中的月台燈柱
        function createPlatformLamp(zPos) {
            const lampGroup = new THREE.Group();
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 3.5, 12), postMat);
            pole.position.y = 1.75;
            
            // 紅色燈罩基座與燈頭
            const capMat = new THREE.MeshStandardMaterial({ color: 0xcc2222 });
            const cap = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.2, 16), capMat);
            cap.position.y = 3.5;
            
            lampGroup.add(pole, cap);
            lampGroup.position.set(3.2, 0, zPos);
            return lampGroup;
        }
        for (let z = -60; z <= 60; z += 20) {
            scene.add(createPlatformLamp(z));
        }

        // 9. 完全對照照片的精緻懸臂式電線桿模組
        const poleMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.7 }); 
        const armMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.6, roughness: 0.3 }); 
        const insMat = new THREE.MeshStandardMaterial({ color: 0x5c2c16, roughness: 0.4 }); // 咖啡色絕緣子

        function createCylinderBetween(p1, p2, radius, material) {
            const distance = p1.distanceTo(p2);
            const geometry = new THREE.CylinderGeometry(radius, radius, distance, 8);
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.copy(new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5));
            mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), new THREE.Vector3().subVectors(p2, p1).normalize());
            return mesh;
        }

        function createCatenaryPole(zPos) {
            const group = new THREE.Group();
            const poleX = 4.2; // 立在月台右側邊緣
            const wireTargetX = 1.6; 

            // 主白色鋼管柱（帶有擬真高度）
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.25, 8.5, 16), poleMat);
            pole.position.set(poleX, 4.25, 0);
            pole.castShadow = true;
            group.add(pole);

            // 上方橫臂
            const pTop = new THREE.Vector3(poleX - 0.2, 7.2, 0);   
            const pMid = new THREE.Vector3(poleX - 0.2, 5.0, 0);   
            const pEnd = new THREE.Vector3(wireTargetX, 7.2, 0);       
            group.add(createCylinderBetween(pTop, pEnd, 0.045, armMat));

            // 斜拉固定支架
            group.add(createCylinderBetween(new THREE.Vector3(poleX - 0.2, 6.5, 0), new THREE.Vector3(poleX - 1.8, 7.2, 0), 0.03, armMat));

            // 咖啡色絕緣子與懸臂組合
            const pInsStart = new THREE.Vector3(poleX - 1.4, 5.7, 0);
            const pInsEnd = new THREE.Vector3(poleX - 2.1, 6.1, 0);
            const pSlantEnd = new THREE.Vector3(wireTargetX - 0.1, 6.8, 0);

            group.add(createCylinderBetween(pMid, pInsStart, 0.035, armMat));
            group.add(createCylinderBetween(pInsStart, pInsEnd, 0.065, insMat)); // 咖啡色絕緣子
            group.add(createCylinderBetween(pInsEnd, pSlantEnd, 0.035, armMat));

            // 垂直吊線支架
            group.add(createCylinderBetween(pEnd, new THREE.Vector3(wireTargetX, 5.5, 0), 0.025, armMat));

            group.position.set(0, 0, zPos);
            return group;
        }

        // 在右側依序生成電線桿
        for (let z = -100; z <= 100; z += 18) {
            scene.add(createCatenaryPole(z));
        }

        // 10. 動畫迴圈
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // 視窗自動適應
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
