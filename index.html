<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <title>台灣3D鐵路模擬器</title>
    <style>
        body {
            background-color: #050505;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            margin: 0;
            line-height: 40px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .join-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2;
            color: #fff;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #aaa;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>
    <div id="canvas-container"></div>
    <div class="info">軌距設定：1067mm 臺鐵特有窄軌規格 (全立體碎石道床版)</div>

    <script>
        // 1. 建立場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x080808);
        scene.fog = new THREE.FogExp2(0x080808, 0.02);

        // 2. 建立相機
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.2, 3.2, 7.5);
        camera.lookAt(0, 0, -2);

        // 3. 建立渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 燈光系統
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.4);
        sunLight.position.set(5, 12, 6);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0005;
        scene.add(sunLight);

        // 補光燈，確保各角度都有光
        const backLight = new THREE.DirectionalLight(0x99bbff, 0.6);
        backLight.position.set(-5, 8, -5);
        scene.add(backLight);

        // 5. 建立全立體碎石道床（用大量緊密碎石取代平整板子）
        const stoneGeo = new THREE.DodecahedronGeometry(0.15, 0);
        const stoneMats = [
            new THREE.MeshStandardMaterial({ color: 0x42403d, roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0x2e2d2b, roughness: 0.9 }),
            new THREE.MeshStandardMaterial({ color: 0x54524e, roughness: 0.75 }),
            new THREE.MeshStandardMaterial({ color: 0x1f1e1d, roughness: 0.95 })
        ];

        // 大量生成碎石，呈現道床厚度與寬度
        const rows = 180; // 沿著軌道方向的密度
        const cols = 14;  // 橫向寬度密度
        
        for (let r = 0; r < rows; r++) {
            const zPos = (r - rows / 2) * 0.45;
            for (let c = 0; c < cols; c++) {
                // 讓道床呈現梯形（中間寬、旁邊稍微變窄掉落）
                const widthFactor = 4.2 - Math.abs(c - cols/2) * 0.15;
                const xPos = (c - cols / 2) * 0.32 + (Math.random() - 0.5) * 0.1;
                
                if (Math.abs(xPos) < widthFactor) {
                    const mat = stoneMats[Math.floor(Math.random() * stoneMats.length)];
                    const stone = new THREE.Mesh(stoneGeo, mat);
                    
                    // 隨機高低起伏，製造真實碎石堆疊感
                    const yPos = -0.3 + (Math.random() * 0.12);
                    
                    stone.position.set(xPos, yPos, zPos);
                    stone.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                    
                    const scale = 0.7 + Math.random() * 0.6;
                    stone.scale.set(scale, scale * 0.6, scale);
                    
                    stone.castShadow = true;
                    stone.receiveShadow = true;
                    scene.add(stone);
                }
            }
        }

        // 6. 金屬鋼軌（亮銀色，帶有金屬光澤與微光，絕對不會變黑）
        const railMat = new THREE.MeshStandardMaterial({ 
            color: 0xd8d8d8,       // 亮銀灰色
            metalness: 0.9,        // 高金屬感
            roughness: 0.2,        // 光滑反射
            emissive: 0x222222     // 些微自發光，確保陰影處也能看見金屬質感
        });

        function createRail() {
            const railGroup = new THREE.Group();
            
            // 軌頭
            const headGeo = new THREE.BoxGeometry(0.12, 0.12, 85);
            const head = new THREE.Mesh(headGeo, railMat);
            head.position.y = 0.31;
            head.castShadow = true;
            railGroup.add(head);

            // 軌腰
            const webGeo = new THREE.BoxGeometry(0.05, 0.2, 85);
            const web = new THREE.Mesh(webGeo, railMat);
            web.position.y = 0.16;
            web.castShadow = true;
            railGroup.add(web);

            // 軌底
            const baseGeo = new THREE.BoxGeometry(0.22, 0.08, 85);
            const base = new THREE.Mesh(baseGeo, railMat);
            base.position.y = 0.04;
            base.castShadow = true;
            railGroup.add(base);

            return railGroup;
        }

        const gaugeHalf = 1.067 / 2; // 1067mm 窄軌
        
        const leftRail = createRail();
        leftRail.position.x = -gaugeHalf;
        scene.add(leftRail);

        const rightRail = createRail();
        rightRail.position.x = gaugeHalf;
        scene.add(rightRail);

        // 7. 枕木群
        const sleeperGeo = new THREE.BoxGeometry(2.4, 0.18, 0.45);
        const sleeperMat = new THREE.MeshStandardMaterial({ 
            color: 0x4a3319, 
            roughness: 0.85 
        });
        
        const sleeperCount = 85;
        const sleeperSpacing = 0.8;
        
        for (let i = 0; i < sleeperCount; i++) {
            const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
            const zPos = (i - sleeperCount / 2) * sleeperSpacing;
            sleeper.position.set(0, -0.05, zPos);
            sleeper.castShadow = true;
            sleeper.receiveShadow = true;
            scene.add(sleeper);
        }

        // 8. 渲染迴圈
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
