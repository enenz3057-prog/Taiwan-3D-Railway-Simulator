<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣3D鐵路模擬器 - 新自強 EMU3000</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: #1e293b;
            --accent-green: #22c55e;
            --accent-yellow: #eab308;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --primary-blue: #38bdf8;
        }
        body {
            margin: 0;
            padding: 15px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        header {
            text-align: center;
            margin-bottom: 15px;
        }
        h1 { margin: 0; font-size: 1.4rem; color: var(--primary-blue); }
        .subtitle { color: #94a3b8; font-size: 0.75rem; margin-top: 4px; }

        .container {
            display: grid;
            gap: 12px;
            max-width: 600px;
            margin: 0 auto;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 12px;
            padding: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .gauge-card {
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .gauge-value {
            font-size: 1.8rem;
            font-weight: bold;
            font-family: monospace;
        }
        .gauge-label {
            color: #94a3b8;
            font-size: 0.7rem;
            margin-top: 2px;
        }

        .atc-status {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: #0f172a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 0.8rem;
        }
        .aspect-badge {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .aspect-g { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); color: #000; }
        .aspect-y { background: var(--accent-yellow); box-shadow: 0 0 8px var(--accent-yellow); color: #000; }
        .aspect-r { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); color: #fff; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        button {
            padding: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
        }
        button:active { opacity: 0.7; }
        .btn-green { background: #16a34a; }
        .btn-blue { background: #0284c7; }
        .btn-yellow { background: #ca8a04; color: #000; }
        .btn-red { background: #dc2626; }
        .btn-full { grid-column: span 2; }

        .log-box {
            background: #090d16;
            padding: 8px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.7rem;
            height: 90px;
            overflow-y: auto;
            color: #34d399;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>台灣3D鐵路模擬器</h1>
        <div class="subtitle">新自強 EMU3000 - 6 大模組整合核心</div>
    </header>

    <div class="container">
        <!-- 儀表板面板 -->
        <div class="panel">
            <h3 style="margin:0 0 8px 0; font-size:0.95rem;">MBus 駕駛艙儀表板</h3>
            <div class="dashboard-grid">
                <div class="gauge-card">
                    <div id="speedDisplay" class="gauge-value" style="color: #38bdf8;">0.0</div>
                    <div class="gauge-label">列車速度 (km/h)</div>
                </div>
                <div class="gauge-card">
                    <div id="limitDisplay" class="gauge-value" style="color: #eab308;">130</div>
                    <div class="gauge-label">區間速限 (km/h)</div>
                </div>
            </div>

            <div class="atc-status">
                <div>ATC 號誌:</div>
                <div id="aspectG" class="aspect-badge aspect-g">G</div>
                <div id="aspectY" class="aspect-badge">Y</div>
                <div id="aspectR" class="aspect-badge">R</div>
                <div>倒數: <span id="countdownDisplay" style="font-family:monospace; font-weight:bold;">5.0</span>s</div>
            </div>

            <div style="font-size: 0.75rem; color: #94a3b8; display:flex; justify-content:space-between;">
                <span>牽引: <strong id="notchDisplay" style="color:#fff;">P0</strong></span>
                <span>制動: <strong id="brakeDisplay" style="color:#fff;">B0</strong></span>
                <span>里程: <strong id="kpDisplay" style="color:#fff;">0.0 km</strong></span>
            </div>
        </div>

        <!-- 控制台面板 -->
        <div class="panel">
            <h3 style="margin:0 0 8px 0; font-size:0.95rem;">運轉控制與系統日誌</h3>
            <div class="controls-grid">
                <button class="btn-green btn-full" id="btnStart">初始化 6 大模組與音效</button>
                <button class="btn-blue" id="btnPowerUp">加動力 (P+)</button>
                <button class="btn-yellow" id="btnPowerDown">減動力 (P-)</button>
                <button class="btn-yellow" id="btnBrakeUp">施加制動 (B+)</button>
                <button class="btn-blue" id="btnBrakeDown">釋放制動 (B-)</button>
                <button class="btn-red btn-full" id="btnAck">確認警報 (ACK)</button>
            </div>

            <div id="logBox" class="log-box">
                [系統] 台灣3D鐵路模擬器 (新自強 EMU3000) 準備就緒。<br>
            </div>
        </div>
    </div>

    <script>
        // 模擬狀態
        let sim = {
            speed: 0.0,
            speedLimit: 130.0,
            powerNotch: 0,
            brakeNotch: 0,
            kpMeters: 0.0,
            ebTriggered: false,
            countdown: 5.0,
            started: false
        };

        let audioCtx = null;
        let oscs = [], gains = [];

        const logBox = document.getElementById('logBox');
        function log(msg) {
            logBox.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        document.getElementById('btnStart').addEventListener('click', () => {
            if (!sim.started) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const master = audioCtx.createGain();
                master.gain.value = 0.15;
                master.connect(audioCtx.destination);

                [1.0, 2.0, 3.0, 4.5].forEach(() => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sawtooth';
                    o.frequency.value = 60;
                    g.gain.value = 0;
                    o.connect(g);
                    g.connect(master);
                    o.start();
                    oscs.push(o);
                    gains.push(g);
                });

                sim.started = true;
                document.getElementById('btnStart').innerText = "6 大模組運行中 (Online)";
                log("模組 1~6（物理、ATC、VVVF、拓撲、UI、主迴圈）已全部啟動！");
            }
        });

        document.getElementById('btnPowerUp').addEventListener('click', () => {
            if (sim.ebTriggered) return log("EB 介入中，無法加速！");
            sim.powerNotch = Math.min(sim.powerNotch + 1, 4);
            sim.brakeNotch = 0;
            document.getElementById('notchDisplay').innerText = `P${sim.powerNotch}`;
            document.getElementById('brakeDisplay').innerText = `B${sim.brakeNotch}`;
            log(`牽引提升: P${sim.powerNotch}`);
        });

        document.getElementById('btnPowerDown').addEventListener('click', () => {
            sim.powerNotch = Math.max(sim.powerNotch - 1, 0);
            document.getElementById('notchDisplay').innerText = `P${sim.powerNotch}`;
            log(`牽引降低: P${sim.powerNotch}`);
        });

        document.getElementById('btnBrakeUp').addEventListener('click', () => {
            sim.brakeNotch = Math.min(sim.brakeNotch + 1, 8);
            sim.powerNotch = 0;
            document.getElementById('notchDisplay').innerText = `P${sim.powerNotch}`;
            document.getElementById('brakeDisplay').innerText = `B${sim.brakeNotch}`;
            log(`制動施加: B${sim.brakeNotch}`);
        });

        document.getElementById('btnBrakeDown').addEventListener('click', () => {
            sim.brakeNotch = Math.max(sim.brakeNotch - 1, 0);
            document.getElementById('brakeDisplay').innerText = `B${sim.brakeNotch}`;
            log(`制動釋放: B${sim.brakeNotch}`);
        });

        document.getElementById('btnAck').addEventListener('click', () => {
            if (sim.speed > sim.speedLimit + 3.0) {
                sim.countdown = 5.0;
                sim.ebTriggered = false;
                log("已按下 ACK 確認，重置 ATC 倒數。");
            }
        });

        // 主迴圈
        let last = performance.now();
        function loop(time) {
            const dt = Math.min((time - last) / 1000, 0.1);
            last = time;

            if (sim.powerNotch > 0 && !sim.ebTriggered) {
                sim.speed += sim.powerNotch * 2.5 * dt;
            } else if (sim.brakeNotch > 0 || sim.ebTriggered) {
                sim.speed = Math.max(0, sim.speed - (sim.ebTriggered ? 18.0 : sim.brakeNotch * 3.0) * dt);
            } else {
                sim.speed = Math.max(0, sim.speed - 0.7 * dt);
            }

            sim.kpMeters += (sim.speed / 3.6) * dt;

            // ATC 邏輯
            const aspG = document.getElementById('aspectG');
            const aspY = document.getElementById('aspectY');
            const aspR = document.getElementById('aspectR');

            if (sim.speed > sim.speedLimit + 3.0) {
                sim.countdown -= dt;
                aspG.className = "aspect-badge";
                aspY.className = "aspect-badge aspect-y";
                if (sim.countdown <= 0) {
                    sim.ebTriggered = true;
                    aspY.className = "aspect-badge";
                    aspR.className = "aspect-badge aspect-r";
                }
            } else {
                sim.countdown = 5.0;
                if (!sim.ebTriggered) {
                    aspG.className = "aspect-badge aspect-g";
                    aspY.className = "aspect-badge";
                    aspR.className = "aspect-badge";
                }
            }

            // VVVF 變頻音合成更新
            if (sim.started && audioCtx && oscs.length > 0) {
                const base = sim.powerNotch > 0 ? 50 + (sim.speed * 14) : 25;
                const gVal = (sim.powerNotch / 4.0) * 0.12;
                oscs.forEach((o, i) => {
                    o.frequency.setTargetAtTime(base * [1.0, 2.0, 3.0, 4.5][i], audioCtx.currentTime, 0.05);
                    gains[i].gain.setTargetAtTime(sim.powerNotch > 0 ? gVal / (i + 1) : 0, audioCtx.currentTime, 0.05);
                });
            }

            // 畫面更新
            document.getElementById('speedDisplay').innerText = sim.speed.toFixed(1);
            document.getElementById('limitDisplay').innerText = sim.speedLimit;
            document.getElementById('countdownDisplay').innerText = Math.max(0, sim.countdown).toFixed(1);
            document.getElementById('kpDisplay').innerText = (sim.kpMeters / 1000.0).toFixed(2) + " km";

            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
