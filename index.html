<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <title>台灣3D鐵路模擬器</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            margin: 0;
            line-height: 40px;
        }
        /* 右上角加入會員按鈕樣式 */
        .join-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2; /* Discord 經典藍紫色 */
            color: #fff;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: background-color 0.2s, transform 0.1s;
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        .join-btn:active {
            transform: scale(0.98);
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #aaa;
            z-index: 10;
            pointer-events: none;
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 引入 OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    
    <!-- 右上角加入會員按鈕，點擊後另開視窗前往 Discord -->
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>

    <div id="canvas-container"></div>
    <div class="info">軌距設定：1067mm 臺鐵特有窄軌規格 | 滑鼠左鍵旋轉、右鍵平移、滾輪縮放</div>

    <script>
        // 確保 Three.js 有成功載入
        if (typeof THREE === 'undefined') {
            alert('Three.js 載入失敗，請檢查網路連線');
        } else {
            // 1. 場景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            // 2. 相機
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, 10);
            camera.lookAt(0, 0, 0);

            // 3. 渲染器
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // 4. 控制器
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // 5. 燈光 (確保物件有光才看的見)
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            // 6. 建立鐵道元件
            // 道床
            const ballastGeo = new THREE.BoxGeometry(5, 0.5, 50);
            const ballastMat = new THREE.MeshStandardMaterial({ color: 0x3d3d3d });
            const ballast = new THREE.Mesh(ballastGeo, ballastMat);
            ballast.position.y = -0.25;
            scene.add(ballast);

            // 鋼軌
            const railGeo = new THREE.BoxGeometry(0.2, 0.4, 50);
            const railMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
            const railLeft = new THREE.Mesh(railGeo, railMat);
            const railRight = new THREE.Mesh(railGeo, railMat);
            railLeft.position.set(-1.067 / 2, 0.2, 0);
            railRight.position.set(1.067 / 2, 0.2, 0);
            scene.add(railLeft, railRight);

            // 枕木
            const sleeperGeo = new THREE.BoxGeometry(2.6, 0.2, 0.5);
            const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });
            const sleeperCount = 70;
            const sleeperSpacing = 0.7;
            for (let i = 0; i < sleeperCount; i++) {
                const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
                sleeper.position.set(0, -0.05, (i - (sleeperCount / 2)) * sleeperSpacing);
                scene.add(sleeper);
            }

            // 7. 動畫迴圈
            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }
            animate();

            // 視窗縮放適應
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
