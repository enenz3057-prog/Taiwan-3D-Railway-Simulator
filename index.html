<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>台灣3D鐵路模擬器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        #canvas-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 第一人稱駕駛艙擋風玻璃框架 (模擬火車車頭視角) */
        .cockpit-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            box-shadow: inset 0 0 100px rgba(0,0,0,0.8);
            border-top: 15px solid #1a1a1a;
            border-left: 25px solid #222;
            border-right: 25px solid #222;
            z-index: 5;
        }

        /* 駕駛艙上方的玻璃反射與遮陽罩 */
        .visor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), rgba(0, 0, 0, 0));
            z-index: 6;
            pointer-events: none;
        }

        /* Roblox 風格 HUD 抬頭顯示 */
        .hud-overlay {
            position: absolute;
            top: 25px;
            left: 35px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
        }
        .hud-badge {
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #00f0ff;
            border-radius: 8px;
            padding: 8px 16px;
            font-family: monospace;
            font-size: 0.95rem;
            color: #00f0ff;
            text-shadow: 0 0 5px rgba(0,240,255,0.5);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        /* Roblox 駕駛控制檯儀表面板 */
        .control-console {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(to top, #0f172a 80%, rgba(15, 23, 42, 0.9));
            border-top: 4px solid #38bdf8;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.9);
        }

        .instrument-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .speedometer {
            background: #020617;
            border: 3px solid #334155;
            border-radius: 12px;
            padding: 10px 25px;
            text-align: center;
            min-width: 150px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
        }
        .speed-title {
            font-size: 0.75rem;
            color: #94a3b8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .speed-number {
            font-size: 2.5rem;
            font-weight: 900;
            color: #38bdf8;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 12px rgba(56, 189, 248, 0.8);
        }

        .notch-display {
            background: #020617;
            border: 2px solid #334155;
            border-radius: 8px;
            padding: 8px 15px;
            text-align: center;
            font-family: monospace;
            color: #f59e0b;
            font-size: 1.1rem;
            font-weight: bold;
        }

        /* 遊戲化控制按鈕 */
        .btn-group {
            display: flex;
            gap: 15px;
        }
        .game-btn {
            background: linear-gradient(135deg, #1e293b, #334155);
            color: #fff;
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #0f172a, 0 8px 15px rgba(0,0,0,0.4);
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #0f172a, 0 3px 8px rgba(0,0,0,0.4);
        }
        .game-btn.pwr {
            background: linear-gradient(135deg, #16a34a, #22c55e);
            border-color: #4ade80;
            box-shadow: 0 5px 0 #14532d, 0 8px 15px rgba(22, 197, 94, 0.3);
        }
        .game-btn.brk {
            background: linear-gradient(135deg, #dc2626, #ef4444);
            border-color: #f87171;
            box-shadow: 0 5px 0 #7f1d1d, 0 8px 15px rgba(239, 68, 68, 0.3);
        }
        .game-btn.horn {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            border-color: #fbbf24;
            box-shadow: 0 5px 0 #78350f, 0 8px 15px rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body>

    <div class="cockpit-frame"></div>
    <div class="visor"></div>

    <div class="hud-overlay">
        <div class="hud-badge">🚄 台灣3D鐵路模擬器</div>
        <div class="hud-badge" style="border-color:#f59e0b; color:#f59e0b;">📍 區段：縱貫線 / 高屏高架段</div>
    </div>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <!-- Roblox 駕駛艙儀表控制列 -->
    <div class="control-console">
        <div class="instrument-cluster">
            <div class="speedometer">
                <div class="speed-title">SPEED</div>
                <div class="speed-number"><span id="speedVal">0</span> <span style="font-size:1.2rem;">km/h</span></div>
            </div>
            <div class="notch-display">
                段位: <span id="notchVal" style="color:#00f0ff;">N (惰行)</span>
            </div>
        </div>

        <div class="btn-group">
            <button class="game-btn pwr" onclick="addThrottle()">⚡ 加速 (P)</button>
            <button class="game-btn" onclick="setCoasting()">⚙️ 惰行 (N)</button>
            <button class="game-btn brk" onclick="applyBrake()">🛑 煞車 (B)</button>
            <button class="game-btn horn" onclick="playHorn()">📣 警笛 (H)</button>
        </div>
    </div>

    <!-- Three.js 引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x38bdf8); // Sky Blue
        scene.fog = new THREE.FogExp2(0x38bdf8, 0.008);

        // 第一人稱駕駛視角 Camera
        const camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 0); // 位於駕駛座頭部高度

        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('simCanvas'), antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.shadowMap.enabled = true;

        // 光源設定
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffbeb, 1.0);
        sunLight.position.set(50, 80, 30);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 建構高架鐵道世界
        const trackLength = 1000;
        const trackGroup = new THREE.Group();

        // 高架橋底座
        const bridgeGeo = new THREE.BoxGeometry(10, 1, trackLength);
        const bridgeMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.5 });
        const bridge = new THREE.Mesh(bridgeGeo, bridgeMat);
        bridge.position.set(0, -0.5, -trackLength / 2);
        trackGroup.add(bridge);

        // 高架橋墩與護欄
        for (let z = 0; z > -trackLength; z -= 40) {
            const pier = new THREE.Mesh(
                new THREE.BoxGeometry(3, 12, 3),
                new THREE.MeshStandardMaterial({ color: 0x64748b })
            );
            pier.position.set(0, -6.5, z);
            trackGroup.add(pier);
        }

        // 枕木與鋼軌
        const railMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.8, roughness: 0.2 });
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x451a03 });

        for (let z = 0; z > -trackLength; z -= 2.5) {
            const sleeper = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.15, 0.5), sleeperMat);
            sleeper.position.set(0, 0.08, z);
            trackGroup.add(sleeper);
        }

        // 本軌與側軌 (雙軌)
        const leftRail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, trackLength), railMat);
        leftRail.position.set(-1.0, 0.25, -trackLength / 2);
        trackGroup.add(leftRail);

        const rightRail = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.2, trackLength), railMat);
        rightRail.position.set(1.0, 0.25, -trackLength / 2);
        trackGroup.add(rightRail);

        // 鐵路電線桿與高壓線門架 (台鐵高架樣式)
        for (let z = 0; z > -trackLength; z -= 30) {
            const poleMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 });
            
            const poleLeft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 8), poleMat);
            poleLeft.position.set(-4, 4, z);
            trackGroup.add(poleLeft);

            const beam = new THREE.Mesh(new THREE.BoxGeometry(8.5, 0.15, 0.15), poleMat);
            beam.position.set(0, 7.8, z);
            trackGroup.add(beam);
        }

        scene.add(trackGroup);

        // 駕駛與物理狀態變數
        let speed = 0;
        let notch = 0; // -3 (Brake) ~ 0 (Neutral) ~ 4 (Power)
        let distance = 0;

        function updateNotchUI() {
            const notchElem = document.getElementById('notchVal');
            if (notch > 0) {
                notchElem.innerText = `P${notch} (牽引)`;
                notchElem.style.color = '#4ade80';
            } else if (notch < 0) {
                notchElem.innerText = `B${Math.abs(notch)} (制動)`;
                notchElem.style.color = '#f87171';
            } else {
                notchElem.innerText = 'N (惰行)';
                notchElem.style.color = '#00f0ff';
            }
        }

        function addThrottle() {
            notch = Math.min(notch + 1, 4);
            updateNotchUI();
        }

        function setCoasting() {
            notch = 0;
            updateNotchUI();
        }

        function applyBrake() {
            notch = Math.max(notch - 1, -3);
            updateNotchUI();
        }

        function playHorn() {
            // 模擬喇叭聲震動效果
            camera.position.y += 0.08;
            setTimeout(() => camera.position.y -= 0.08, 100);
        }

        // 動畫渲染迴圈
        function animate() {
            requestAnimationFrame(animate);

            // 根據 notch 計算速度變化
            if (notch > 0) {
                speed = Math.min(speed + notch * 0.15, 130);
            } else if (notch < 0) {
                speed = Math.max(speed + notch * 0.4, 0);
            } else {
                // 惰行自然風阻減速
                speed = Math.max(speed - 0.03, 0);
            }

            // 推進位置
            if (speed > 0) {
                distance += (speed / 3600) * 2;
                if (distance > trackLength / 2) {
                    distance = 0; // 循環道路
                }
                camera.position.z = -distance * 20;

                // 模擬真實列車高架行進振動
                camera.position.y = 2.5 + Math.sin(Date.now() * 0.02) * 0.015 * (speed / 80);
                camera.position.x = Math.cos(Date.now() * 0.01) * 0.01 * (speed / 100);
            }

            document.getElementById('speedVal').innerText = Math.round(speed);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
