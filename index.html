<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="__1kAC5hQYxQmy1DhMZvTPq0wvNsREk-6Ke8dhu5Sok" />
    <title>台灣3D鐵路模擬器</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        h1 {
            color: #ffcc00;
            font-size: 22px;
            position: absolute;
            top: 10px;
            left: 20px;
            z-index: 10;
            margin: 0;
            line-height: 40px;
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        /* 縮小後的加入會員按鈕樣式 */
        .join-btn {
            position: absolute;
            top: 12px;
            right: 20px;
            z-index: 20;
            background-color: #5865F2;
            color: #fff;
            padding: 6px 14px; /* 縮小按鈕內距 */
            font-size: 12px;   /* 縮小字體 */
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: background-color 0.2s;
        }
        .join-btn:hover {
            background-color: #4752C4;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-size: 14px;
            color: #aaa;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <h1>台灣3D鐵路模擬器</h1>
    <a href="https://discord.gg/wzK5PtsHt" target="_blank" class="join-btn">加入會員</a>
    <div id="canvas-container"></div>
    <div class="info">軌距設定：1067mm 臺鐵特有窄軌規格 (立體光影強化版)</div>

    <script>
        // 1. 建立場景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x151515);
        scene.fog = new THREE.FogExp2(0x151515, 0.03);

        // 2. 建立相機
        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(2.5, 3.5, 8);
        camera.lookAt(0, 0, -2);

        // 3. 建立渲染器
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 4. 建立燈光
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
        sunLight.position.set(8, 12, 5);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x88bbff, 0.5);
        fillLight.position.set(-8, 5, -5);
        scene.add(fillLight);

        // 5. 建立鐵道元件
        // (A) 道床
        const ballastGeo = new THREE.BoxGeometry(4.8, 0.6, 80);
        const ballastMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b, roughness: 0.9 });
        const ballast = new THREE.Mesh(ballastGeo, ballastMat);
        ballast.position.y = -0.3;
        ballast.receiveShadow = true;
        scene.add(ballast);

        // (B) 立體鋼軌群
        const railMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.95, roughness: 0.15 });

        function createRail() {
            const railGroup = new THREE.Group();
            
            const headGeo = new THREE.BoxGeometry(0.12, 0.12, 80);
            const head = new THREE.Mesh(headGeo, railMat);
            head.position.y = 0.31;
            head.castShadow = true;
            railGroup.add(head);

            const webGeo = new THREE.BoxGeometry(0.05, 0.2, 80);
            const web = new THREE.Mesh(webGeo, railMat);
            web.position.y = 0.16;
            web.castShadow = true;
            railGroup.add(web);

            const baseGeo = new THREE.BoxGeometry(0.22, 0.08, 80);
            const base = new THREE.Mesh(baseGeo, railMat);
            base.position.y = 0.04;
            base.castShadow = true;
            railGroup.add(base);

            return railGroup;
        }

        const gaugeHalf = 1.067 / 2;
        
        const leftRail = createRail();
        leftRail.position.x = -gaugeHalf;
        scene.add(leftRail);

        const rightRail = createRail();
        rightRail.position.x = gaugeHalf;
        scene.add(rightRail);

        // (C) 枕木群
        const sleeperGeo = new THREE.BoxGeometry(2.4, 0.2, 0.45);
        const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x4a3319, roughness: 0.8 });
        
        const sleeperCount = 80;
        const sleeperSpacing = 0.8;
        
        for (let i = 0; i < sleeperCount; i++) {
            const sleeper = new THREE.Mesh(sleeperGeo, sleeperMat);
            const zPos = (i - sleeperCount / 2) * sleeperSpacing;
            sleeper.position.set(0, -0.01, zPos);
            sleeper.castShadow = true;
            sleeper.receiveShadow = true;
            scene.add(sleeper);
        }

        // 6. 動態渲染
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime() * 0.2;
            sunLight.position.x = 8 + Math.sin(time) * 1;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
